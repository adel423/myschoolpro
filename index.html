    <style>
        :root {

            --card-bg: #ffffff;

            --bubble-sent: #0084ff;
            --bubble-received: #e4e6eb;
            --bubble-text-sent: #ffffff;
            --bubble-text-received: #050505;
            --online-dot: #31a24c;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.1);
            --border-light: #ced0d4;
            --badge-bg: #f02849;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        body { background-color: var(--sky-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .login-screen {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow-sm);
            max-width: 400px;
            width: 90%;
            padding: 30px;
            text-align: center;
            z-index: 1000;
        }

        .user-list { max-height: 350px; overflow-y: auto; margin: 15px 0; border: 1px solid var(--border-light); border-radius: 12px; }
        .user-item { 
            display: flex; align-items: center; padding: 10px; border-bottom: 1px solid #f0f0f0; 
            cursor: pointer; transition: 0.2s; position: relative; text-align: right;
        }
        .user-item:hover { background: #f5f5f5; }
        .user-item.selected { background: var(--primary-light); border-right: 4px solid var(--primary); }
        .user-avatar-img { width: 50px; height: 50px; border-radius: 50%; margin-left: 12px; object-fit: cover; background: #eee; }

        .search-box { 
            width: 100%; padding: 12px 40px 12px 12px; border-radius: 20px; 
            border: 1px solid var(--border-light); background: #f0f2f5; outline: none; 
        }

        #app {
            display: none;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            background: var(--card-bg);
            position: relative;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        .main-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; }
        .main-header h2 { font-size: 24px; font-weight: bold; }

        .online-bar { display: flex; padding: 15px 10px; gap: 15px; overflow-x: auto; border-bottom: 1px solid #f0f0f0; }
        .online-user { display: flex; flex-direction: column; align-items: center; min-width: 70px; cursor: pointer; position: relative; }
        .story-avatar { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--primary); padding: 2px; }
        .active-dot { 
            width: 14px; height: 14px; background: var(--online-dot); 
            border: 2px solid white; border-radius: 50%; position: absolute; bottom: 18px; right: 8px; 
        }

        .chats-list { flex: 1; overflow-y: auto; }
        .chat-row { 
            display: flex; padding: 12px 15px; align-items: center; 
            cursor: pointer; position: relative; transition: 0.2s; 
        }
        .chat-row:hover { background: #f5f5f5; }
        .chat-info { margin-right: 12px; flex: 1; }
        .chat-info h5 { font-size: 15px; margin-bottom: 3px; color: var(--secondary); }
        .chat-info p { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .unread-badge { 
            background: var(--badge-bg); color: white; border-radius: 50%; 
            min-width: 20px; height: 20px; font-size: 11px; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            padding: 0 5px; position: absolute; left: 20px; top: 50%; transform: translateY(-50%);
        }

        .chat-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: white; z-index: 200; display: none; flex-direction: column; 
        }
        .chat-header { 
            padding: 10px; display: flex; align-items: center; 
            border-bottom: 1px solid #ddd; box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
        }
        .messages-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 8px; background: #fff; }
        
        .message { display: flex; flex-direction: column; max-width: 75%; }
        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }
        .bubble { padding: 8px 12px; border-radius: 18px; font-size: 14px; position: relative; }
        .sent .bubble { background: var(--bubble-sent); color: var(--bubble-text-sent); border-bottom-right-radius: 4px; }
        .received .bubble { background: var(--bubble-received); color: var(--bubble-text-received); border-bottom-left-radius: 4px; }

        .input-area { padding: 10px; display: flex; align-items: center; gap: 10px; border-top: 1px solid #eee; }
        .input-wrapper.custom { flex: 1; background: #f0f2f5; border-radius: 20px; padding: 5px 15px; }
        .input-wrapper.custom input { width: 100%; border: none; background: transparent; outline: none; padding: 8px; }

        .call-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: #1c1e21; z-index: 1000; display: none; flex-direction: column; 
        }

        .notification { 
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%); 
            background: var(--primary); color: white; padding: 10px 20px; 
            border-radius: 30px; z-index: 10000; display: none; font-size: 14px; box-shadow: var(--shadow-sm);
        }
        
        .admin-panel { background: #fff8e1; border: 1px solid #ffe082; padding: 15px; border-radius: 15px; display: none; margin-top: 15px; text-align: right; }
        .bottom-nav { display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #eee; background: #fff; }
        .nav-item { text-align:center; cursor:pointer; }
        .nav-item.active { color: var(--primary); }
        .nav-item:not(.active) { color: var(--text-muted); }
        
        .incoming-call { position:fixed; top:20px; left:50%; transform:translateX(-50%); width:90%; max-width:350px; background:white; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.3); display:none; z-index:2000; padding:20px; text-align:center; }

// ======================= الإعدادات والمتغيرات =======================
const SUPABASE_URL = 'https://nfywbkvsvmhaczfatxkp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VZMRpated19TvFgjTuf1Lw_uW7dOiHY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const supabaseClient = supabase;  // ✅ مزامنة الاسم المستخدم في القنوات والاستعلامات

const DIRECTOR_ID = '1098107010228600';
let allEmployees = [];
let currentUser = null;

let unreadCounts = JSON.parse(localStorage.getItem('unread_counts') || '{}');
let messagesChannel = null;

let localStream = null;
let peerConnection = null;
let isCallActive = false;
let currentCallType = null;

// ======================= الوظائف المساعدة =======================
function showNotif(msg, icon = '🔔') {
    const notif = document.getElementById('notification');
    notif.innerHTML = `${icon} ${msg}`;
    notif.style.display = 'block';
    setTimeout(() => notif.style.display = 'none', 3000);
}

function playNotificationSound() {
    try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        oscillator.connect(gain);
        gain.connect(audioCtx.destination);
        oscillator.type = 'sine';
        oscillator.frequency.value = 880;
        gain.gain.value = 0.2;
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.15);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.15);
        audioCtx.resume();
    } catch(e) { console.log('صوت:', e); }
    
    if ("vibrate" in navigator) {
        navigator.vibrate(200);
    }
}

function scrollToBottom() {
    const container = document.getElementById('messagesContainer');
    if (container) {
        container.scrollTo({
            top: container.scrollHeight,
            behavior: 'smooth'
        });
    }
}

function formatTimeAgo(date) {
    const d = new Date(date);
    const now = new Date();
    const diff = Math.floor((now - d) / 1000);
    if (diff < 60) return `منذ ${diff} ث`;
    if (diff < 3600) return `منذ ${Math.floor(diff / 60)} د`;
    if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} س`;
    return d.toLocaleDateString('ar');
}

function escapeHtml(str) {
    return str.replace(/[&<>]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' })[m]);
}

function isDirector() {
    return currentUser?.id === DIRECTOR_ID;
}

function saveSession(id) {
    localStorage.setItem('myschool_user', id);
}

function clearSession() {
    localStorage.removeItem('myschool_user');
}

function logout() {
    clearSession();
    if (messagesChannel) supabaseClient.removeChannel(messagesChannel);
    if (typingChannel) supabaseClient.removeChannel(typingChannel);
    currentUser = null;
    document.getElementById('app').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'block';
    renderLoginList();
}

document.getElementById('logoutBtn').onclick = () => logout();

// إدارة الرسائل غير المقروءة
function incrementUnreadCount(chatId, senderId) {
    if (activeChat && ((activeChat.id === 'group' && chatId === 'group') || 
        (activeChat.id !== 'group' && chatId === [currentUser.id, activeChat.id].sort().join('_'))) && 
        senderId !== currentUser.id) {
        return;
    }
    if (senderId === currentUser.id) return;
    unreadCounts[chatId] = (unreadCounts[chatId] || 0) + 1;
    localStorage.setItem('unread_counts', JSON.stringify(unreadCounts));
    renderChatsList();
}

function markChatAsRead(chatId) {
    if (unreadCounts[chatId]) {
        delete unreadCounts[chatId];
        localStorage.setItem('unread_counts', JSON.stringify(unreadCounts));
        renderChatsList();
    }
}

// ======================= تحميل الموظفين =======================
async function loadEmployees() {
    try {
        const response = await fetch('./employees.csv');
        const data = await response.text();
        const lines = data.replace(/^\uFEFF/, '').split('\n').filter(l => l.trim() && !l.startsWith('الرقم'));
        allEmployees = lines.map(line => {
            const p = line.split(';');
            return { id: p[0]?.trim(), name: p[1]?.trim(), job: p[2]?.trim(), avatar_url: null };
        });
        document.getElementById('statusBar').innerHTML = `✅ ${allEmployees.length} موظف`;
        renderLoginList();
        autoLogin();
    } catch(e) {
        document.getElementById('statusBar').innerHTML = '❌ employees.csv غير موجود';
        allEmployees = [];
    }
}

function renderLoginList() {
    const container = document.getElementById('loginUserList');
    if (!allEmployees.length) {
        container.innerHTML = '<div style="padding:20px;">لا يوجد موظفون</div>';
        return;
    }
    container.innerHTML = allEmployees.map(emp => `
        <div class="user-item" onclick="window.selectForLogin('${emp.id}')" id="u-${emp.id}">
            <img class="user-avatar-img" src="https://ui-avatars.com/api/?name=${emp.name}&background=2c2c2e&color=fff&size=45">
            <div><strong>${emp.name}</strong><br><small>${emp.job}</small></div>
        </div>
    `).join('');
}

window.selectForLogin = (id) => {
    currentUser = allEmployees.find(e => e.id === id);
    document.querySelectorAll('.user-item').forEach(el => el.classList.remove('selected'));
    document.getElementById(`u-${id}`).classList.add('selected');
    document.getElementById('passInput').style.display = 'block';
    document.getElementById('loginBtn').style.display = 'block';
};

document.getElementById('loginBtn').onclick = () => {
    const pass = document.getElementById('passInput').value;
    if (pass === currentUser.id) {
        saveSession(currentUser.id);
        startApp();
    } else {
        alert('الرقم الوظيفي غير صحيح');
    }
};

function autoLogin() {
    const saved = localStorage.getItem('myschool_user');
    if (saved && allEmployees.find(e => e.id === saved)) {
        currentUser = allEmployees.find(e => e.id === saved);
        startApp();
    }
}

// ======================= تحميل المكالمات المحلية =======================
function getLocalCallLogs(userId) {
    const key = `call_logs_${userId}`;
    const logs = localStorage.getItem(key);
    return logs ? JSON.parse(logs) : [];
}

function saveLocalCallLogs(userId, logs) {
    localStorage.setItem(`call_logs_${userId}`, JSON.stringify(logs));
}

function addCallLog(callerId, calleeId, callType, answered, durationSec) {
    if (!currentUser) return;
    const logEntry = {
        id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
        caller_id: callerId,
        callee_id: calleeId,
        call_type: callType,
        answered: answered,
        missed: !answered,
        duration_seconds: durationSec || 0,
        timestamp: new Date().toISOString()
    };
    const callerLogs = getLocalCallLogs(callerId);
    callerLogs.unshift(logEntry);
    saveLocalCallLogs(callerId, callerLogs);
    if (callerId !== calleeId) {
        const calleeLogs = getLocalCallLogs(calleeId);
        calleeLogs.unshift(logEntry);
        saveLocalCallLogs(calleeId, calleeLogs);
    }
    if (document.getElementById('callsScreen').style.display === 'block') renderCallsLog();
}

async function renderCallsLog() {
    if (!currentUser) return;
    const logs = getLocalCallLogs(currentUser.id);
    const container = document.getElementById('callsList');
    if (!logs.length) {
        container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">لا توجد مكالمات</div>';
        return;
    }
    container.innerHTML = logs.map(log => {
        const partnerId = log.caller_id === currentUser.id ? log.callee_id : log.caller_id;
        const partner = allEmployees.find(e => e.id === partnerId);
        if (!partner) return '';
        const isMissed = log.missed === true;
        const icon = log.call_type === 'video' ? '<i class="fas fa-video"></i>' : '<i class="fas fa-phone-alt"></i>';
        return `<div class="call-item" style="display:flex; align-items:center; padding:10px; background:white; border-radius:16px; margin-bottom:8px; cursor:pointer;" onclick="window.openChat('${partner.id}','${partner.name}')">
            <div class="call-icon" style="width:40px; text-align:center; font-size:18px; ${isMissed ? 'color:#f44336;' : ''}">${icon}</div>
            <div class="call-details" style="flex:1; margin-right:10px;">
                <div style="font-weight:bold;">${partner.name}</div>
                <div style="font-size:12px; color:gray;">${isMissed ? 'فائتة • ' : ''}${log.duration_seconds ? formatDuration(log.duration_seconds) + ' • ' : ''}${formatTimeAgo(log.timestamp)}</div>
            </div>
            <button class="rappeler-btn" onclick="event.stopPropagation(); window.startCallWithUser('${partner.id}','${log.call_type}')" style="background:none; border:1px solid var(--primary); border-radius:20px; padding:3px 8px; cursor:pointer; color:var(--primary);">معاودة</button>
        </div>`;
    }).join('');
}

function formatDuration(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return m ? `${m}د ${s}ث` : `${s}ث`;
}

window.startCallWithUser = function(userId, type) {
    const partner = allEmployees.find(e => e.id === userId);
    if (partner) openChat(userId, partner.name);
    setTimeout(() => { if (type === 'audio') window.startCall('audio'); else window.startCall('video'); }, 500);
};

// ======================= تهيئة التطبيق =======================
async function startApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    await initRealtimeChannels();
    renderStories();
    renderChatsList();
    showNotif(`👋 أهلاً ${currentUser.name}`);
    if (isDirector()) renderDeleteEmployeeList();
}

function initRealtimeChannels() {
    // قناة الرسائل
    messagesChannel = supabaseClient.channel('messages-channel').on('postgres_changes', {
        event: 'INSERT',
        schema: 'public',
        table: 'messages'
    }, async (payload) => {
        const msg = payload.new;
        if (activeChat) {
            const cid = activeChat.id === 'group' ? 'group' : [currentUser.id, activeChat.id].sort().join('_');
            if (msg.chat_id === cid) {
                await fetchMessages(cid);
            } else if (msg.sender !== currentUser.id) {
                incrementUnreadCount(msg.chat_id, msg.sender);
            }
        } else if (msg.sender !== currentUser.id) {
            incrementUnreadCount(msg.chat_id, msg.sender);
        }
        await renderChatsList();
        if (msg.sender !== currentUser.id) {
            playNotificationSound();
            const sender = allEmployees.find(e => e.id === msg.sender);
            showNotif(`📩 رسالة جديدة من ${sender?.name || 'شخص'}`, '🔔');
        }
    }).subscribe();

    // قناة الكتابة
    typingChannel = supabaseClient.channel('typing', { config: { broadcast: { ack: true } } });
    typingChannel.on('broadcast', { event: 'typing_start' }, ({ payload }) => {
        if (activeChat && payload.chat_id === activeChat.id && payload.user_id !== currentUser.id) {
            document.getElementById('typingIndicator').innerHTML = `${payload.name} يكتب...`;
            document.getElementById('typingIndicator').style.display = 'block';
        }
    }).on('broadcast', { event: 'typing_stop' }, ({ payload }) => {
        if (activeChat && payload.chat_id === activeChat.id && payload.user_id !== currentUser.id) {
            document.getElementById('typingIndicator').style.display = 'none';
        }
    }).subscribe();
}

function renderStories() {
    const container = document.getElementById('storiesContainer');
    container.innerHTML = `<div class="online-user" onclick="alert('يمكنك تغيير صورتك من الإعدادات')">
        <img src="https://ui-avatars.com/api/?name=${currentUser.name}&background=0084ff&color=fff" class="story-avatar">
        <div class="active-dot" style="background:var(--primary);"></div>
        <span style="font-size:11px;">قصتك</span>
    </div>`;
    container.innerHTML += allEmployees.filter(e => e.id !== currentUser.id).map(emp => `
        <div class="online-user" onclick="openChat('${emp.id}', '${emp.name}')">
            <img src="https://ui-avatars.com/api/?name=${emp.name}&background=2c2c2e&color=fff" class="story-avatar">
            <div class="active-dot"></div>
            <span style="font-size:11px;">${emp.name.split(' ')[0]}</span>
        </div>
    `).join('');
}

async function renderChatsList() {
    const container = document.getElementById('chatsList');
    const groupUnread = unreadCounts['group'] || 0;
    
    let lastGroupMsg = '';
    try {
        const { data: lastGroup } = await supabaseClient.from('messages').select('text').eq('chat_id', 'group').order('created_at', { ascending: false }).limit(1);
        if (lastGroup?.length) lastGroupMsg = lastGroup[0].text.replace(/<[^>]*>/g, '').substring(0, 40);
    } catch(e) {}
    
    let html = `<div class="chat-row" onclick="openChat('group', 'المجموعة العامة')">
        <div style="position:relative">
            <img src="https://ui-avatars.com/api/?name=Group&background=0084ff&color=fff" class="user-avatar-img">
            ${groupUnread > 0 ? `<div class="unread-badge">${groupUnread}</div>` : ''}
        </div>
        <div class="chat-info">
            <h5>المجموعة العامة 📢</h5>
            <p>${lastGroupMsg ? escapeHtml(lastGroupMsg) : 'تواصل مع جميع الموظفين'}</p>
        </div>
    </div>`;

    for (const emp of allEmployees.filter(e => e.id !== currentUser.id)) {
        const chatId = [currentUser.id, emp.id].sort().join('_');
        const count = unreadCounts[chatId] || 0;
        let lastMsg = '';
        let lastTime = '';
        try {
            const { data: last } = await supabaseClient.from('messages').select('text,created_at').eq('chat_id', chatId).order('created_at', { ascending: false }).limit(1);
            if (last?.length) {
                lastMsg = last[0].text.replace(/<[^>]*>/g, '').substring(0, 40);
                lastTime = formatTimeAgo(last[0].created_at);
            }
        } catch(e) {}
        html += `<div class="chat-row" onclick="openChat('${emp.id}', '${emp.name}')">
            <div style="position:relative">
                <img src="https://ui-avatars.com/api/?name=${emp.name}" class="user-avatar-img">
                ${count > 0 ? `<div class="unread-badge">${count}</div>` : ''}
            </div>
            <div class="chat-info">
                <h5>${emp.name}</h5>
                <p>${lastMsg ? escapeHtml(lastMsg) : 'ابدأ المحادثة'}</p>
            </div>
            <div class="chat-time" style="font-size:10px; color:gray;">${lastTime}</div>
        </div>`;
    }
    container.innerHTML = html;
}

// ======================= الدردشة =======================
window.openChat = async (id, name) => {
    activeChat = { id, name };
    const chatId = id === 'group' ? 'group' : [currentUser.id, id].sort().join('_');
    markChatAsRead(chatId);
    document.getElementById('chatHeaderName').innerText = name;
    document.getElementById('chatHeaderImg').src = `https://ui-avatars.com/api/?name=${name}`;
    document.getElementById('mainView').style.display = 'none';
    document.getElementById('chatScreen').style.display = 'flex';
    document.getElementById('callsScreen').style.display = 'none';
    await fetchMessages(chatId);
};

document.getElementById('closeChatBtn').onclick = () => {
    activeChat = null;
    document.getElementById('chatScreen').style.display = 'none';
    document.getElementById('mainView').style.display = 'flex';
    renderChatsList();
};

async function fetchMessages(chatId) {
    const { data } = await supabaseClient.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
    const container = document.getElementById('messagesContainer');
    if (!data?.length) {
        container.innerHTML = '<div style="text-align:center; margin-top:50px; color:gray;">لا توجد رسائل</div>';
        return;
    }
    container.innerHTML = data.map(m => {
        const isMine = m.sender === currentUser.id;
        let senderName = '';
        if (activeChat.id === 'group' && !isMine) {
            const sender = allEmployees.find(e => e.id === m.sender);
            if (sender) senderName = `<div style="font-size:10px; color:var(--primary); margin-bottom:2px;">${sender.name}</div>`;
        }
        return `<div class="message ${isMine ? 'sent' : 'received'}">
            ${senderName}
            <div class="bubble">${m.text}</div>
            <div class="message-time" style="font-size:9px; color:gray; margin-top:2px;">${formatTimeAgo(m.created_at)}</div>
        </div>`;
    }).join('');
    scrollToBottom();
}

async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if (!text || !activeChat) return;
    const chatId = activeChat.id === 'group' ? 'group' : [currentUser.id, activeChat.id].sort().join('_');
    await supabaseClient.from('messages').insert({
        chat_id: chatId,
        sender: currentUser.id,
        text: text,
        created_at: new Date().toISOString()
    });
    input.value = '';
    await fetchMessages(chatId);
    renderChatsList();
}

document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').onkeydown = (e) => {
    if (e.key === 'Enter') sendMessage();
    if (activeChat && activeChat.id !== 'group' && typingChannel) {
        const chatId = activeChat.id === 'group' ? 'group' : [currentUser.id, activeChat.id].sort().join('_');
        typingChannel.send({
            type: 'broadcast',
            event: 'typing_start',
            payload: { chat_id: activeChat.id, user_id: currentUser.id, name: currentUser.name }
        });
        if (window.typingTimeout) clearTimeout(window.typingTimeout);
        window.typingTimeout = setTimeout(() => {
            typingChannel.send({
                type: 'broadcast',
                event: 'typing_stop',
                payload: { chat_id: activeChat.id, user_id: currentUser.id }
            });
        }, 1500);
    }
};

// ======================= المكالمات =======================
window.startCall = async function(type) {
    if (!activeChat || activeChat.id === 'group') {
        showNotif('اختر محادثة خاصة أولاً', '⚠️');
        return;
    }
    targetUser = allEmployees.find(e => e.id === activeChat.id);
    if (!targetUser) return;
    currentCallType = type;
    isCallActive = true;
    callStartTime = null;
    await setupCall(false);
};

async function setupCall(isAnswer) {
    try {
        const constraints = {
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
            video: currentCallType === 'video' ? { width: { ideal: 640 }, height: { ideal: 480 } } : false
        };
        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        localStream = stream;
        document.getElementById('localVideo').srcObject = stream;
        document.getElementById('callOverlay').style.display = 'flex';
        document.getElementById('callPartnerName').innerText = targetUser.name;
        
        if (peerConnection) peerConnection.close();
        peerConnection = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });
        stream.getTracks().forEach(t => peerConnection.addTrack(t, stream));
        peerConnection.ontrack = e => {
            if (e.streams[0]) document.getElementById('remoteVideo').srcObject = e.streams[0];
            document.getElementById('callStatus').innerHTML = '✅ متصل';
        };
        
        const signalingChannel = supabaseClient.channel('signaling');
        signalingChannel.on('broadcast', { event: 'offer' }, async ({ payload }) => {
            if (payload.target === currentUser.id && !isCallActive) {
                pendingOffer = payload.sdp;
                pendingFrom = payload.from;
                pendingType = payload.type;
                const caller = allEmployees.find(e => e.id === payload.from);
                if (caller) showIncomingCall(caller.name, payload.type, payload.from);
            }
        }).on('broadcast', { event: 'answer' }, async ({ payload }) => {
            if (payload.target === currentUser.id && peerConnection) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
            }
        }).on('broadcast', { event: 'ice' }, async ({ payload }) => {
            if (payload.target === currentUser.id && peerConnection && payload.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
            }
        }).on('broadcast', { event: 'end' }, () => {
            if (isCallActive) window.hangUp();
            document.getElementById('incomingCall').style.display = 'none';
        }).subscribe();
        
        if (isAnswer) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            signalingChannel.send({
                type: 'broadcast',
                event: 'answer',
                payload: { sdp: peerConnection.localDescription, from: currentUser.id, target: targetUser.id }
            });
            callStartTime = Date.now();
        } else {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            signalingChannel.send({
                type: 'broadcast',
                event: 'offer',
                payload: { sdp: peerConnection.localDescription, from: currentUser.id, target: targetUser.id, type: currentCallType }
            });
            callStartTime = Date.now();
        }
    } catch(err) {
        console.error(err);
        showNotif('فشل الوصول للميكروفون/الكاميرا', '❌');
        window.hangUp();
    }
}

window.hangUp = function() {
    if (peerConnection) peerConnection.close();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    if (isCallActive && callStartTime && targetUser && currentUser) {
        const dur = Math.floor((Date.now() - callStartTime) / 1000);
        addCallLog(currentUser.id, targetUser.id, currentCallType, true, dur);
    } else if (!isCallActive && pendingFrom) {
        addCallLog(pendingFrom, currentUser.id, pendingType, false, 0);
    }
    document.getElementById('callOverlay').style.display = 'none';
    isCallActive = false;
    targetUser = null;
    pendingOffer = null;
    pendingFrom = null;
    pendingType = null;
    callStartTime = null;
};

document.getElementById('hangupBtn').onclick = window.hangUp;
document.getElementById('micBtn').onclick = () => {
    if (localStream) {
        const t = localStream.getAudioTracks()[0];
        if (t) {
            t.enabled = !t.enabled;
            document.getElementById('micBtn').innerHTML = t.enabled ? '<i class="fas fa-microphone"></i>' : '<i class="fas fa-microphone-slash"></i>';
        }
    }
};
document.getElementById('camBtn').onclick = () => {
    if (localStream) {
        const t = localStream.getVideoTracks()[0];
        if (t) {
            t.enabled = !t.enabled;
            document.getElementById('camBtn').innerHTML = t.enabled ? '<i class="fas fa-video"></i>' : '<i class="fas fa-video-slash"></i>';
        }
    }
};

function showIncomingCall(name, type, fromId) {
    const div = document.getElementById('incomingCall');
    div.innerHTML = `
    <div style="padding:20px; text-align:center;">
        <h3><i class="fas fa-phone-alt"></i> مكالمة واردة</h3>
        <p><strong>${name}</strong> يطلب مكالمة ${type === 'video' ? 'فيديو' : 'صوتية'}</p>
        <div style="display:flex; gap:15px; justify-content:center; margin-top:15px;">
            <button id="acceptCallBtn" style="padding:10px 20px; background:#10b981; color:white; border:none; border-radius:30px; font-size:16px; cursor:pointer;"><i class="fas fa-check"></i> قبول</button>
            <button id="rejectCallBtn" style="padding:10px 20px; background:#f44336; color:white; border:none; border-radius:30px; font-size:16px; cursor:pointer;"><i class="fas fa-times"></i> رفض</button>
        </div>
    </div>`;
    div.style.display = 'block';
    
    document.getElementById('acceptCallBtn').onclick = async () => {
        div.style.display = 'none';
        targetUser = allEmployees.find(e => e.id === fromId);
        currentCallType = type;
        isCallActive = true;
        await setupCall(true);
    };
    
    document.getElementById('rejectCallBtn').onclick = () => {
        div.style.display = 'none';
        addCallLog(fromId, currentUser.id, type, false, 0);
        // إرسال إشارة إنهاء المكالمة للطرف الآخر
        supabaseClient.channel('signaling').send({
            type: 'broadcast',
            event: 'end',
            payload: { target: fromId }
        });
    };
    
    // رفض تلقائي بعد 30 ثانية
    setTimeout(() => {
        if (div.style.display === 'block') {
            div.style.display = 'none';
            addCallLog(fromId, currentUser.id, type, false, 0);
        }
    }, 30000);
}

};
