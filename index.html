<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Messenger Pro - السحابة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #000; color: #fff; height: 100vh; display: flex; justify-content: center; }
        .app-container { width: 100%; max-width: 450px; height: 100vh; display: flex; flex-direction: column; background: #000; position: relative; }
        /* Header */
        header { display: flex; justify-content: space-between; align-items: center; padding: 15px; }
        header h1 { font-size: 24px; }
        .header-icons { display: flex; gap: 12px; }
        .header-icons i { background: #242424; width: 35px; height: 35px; border-radius: 50%; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        /* المتصلين أفقي */
        .active-users-section { padding: 10px 0; overflow-x: auto; white-space: nowrap; display: flex; gap: 15px; padding-left: 15px; scrollbar-width: none; }
        .active-users-section::-webkit-scrollbar { display: none; }
        .user-story { display: inline-flex; flex-direction: column; align-items: center; min-width: 65px; cursor: pointer; }
        .avatar-container { position: relative; width: 60px; height: 60px; }
        .avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid #0084ff; }
        .online-dot { position: absolute; bottom: 2px; right: 2px; width: 14px; height: 14px; background: #31A24C; border: 3px solid #000; border-radius: 50%; }
        .user-story span { font-size: 12px; margin-top: 5px; color: #ccc; }
        /* قائمة الدردشات */
        .chats-container { flex: 1; overflow-y: auto; padding: 0 15px; }
        .chat-item { display: flex; align-items: center; padding: 12px 0; gap: 12px; cursor: pointer; border-bottom: 1px solid #222; }
        .chat-item img { width: 55px; height: 55px; border-radius: 50%; }
        .chat-details { flex: 1; }
        .chat-name { font-weight: 500; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .chat-message { font-size: 14px; color: #888; margin-top: 2px; }
        .unread-badge { background: #f02849; color: white; border-radius: 50%; min-width: 20px; height: 20px; font-size: 11px; display: inline-flex; align-items: center; justify-content: center; padding: 0 5px; margin-right: 6px; }
        .online-status { font-size: 11px; color: #31A24C; }
        .offline-status { font-size: 11px; color: #888; }
        /* شاشة الدردشة */
        .chat-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 200; display: none; flex-direction: column; }
        .chat-header { padding: 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #222; }
        .back-btn { background: none; border: none; color: white; font-size: 20px; cursor: pointer; }
        .messages-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .message { max-width: 80%; display: flex; flex-direction: column; }
        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }
        .bubble { padding: 10px 14px; border-radius: 18px; font-size: 14px; }
        .sent .bubble { background: #0084ff; color: white; border-bottom-right-radius: 4px; }
        .received .bubble { background: #242424; color: white; border-bottom-left-radius: 4px; }
        .msg-time { font-size: 10px; margin-top: 4px; padding: 0 6px; color: #888; }
        .input-area { padding: 10px; display: flex; gap: 8px; border-top: 1px solid #222; }
        .input-wrapper { flex: 1; background: #242424; border-radius: 25px; padding: 8px 15px; }
        .input-wrapper input { width: 100%; background: transparent; border: none; outline: none; color: white; }
        .call-buttons { display: flex; gap: 12px; margin-left: auto; }
        .call-btn { background: none; border: none; font-size: 18px; cursor: pointer; color: #0084ff; }
        /* المكالمات */
        .call-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:#1c1e21; z-index:1000; display:none; flex-direction:column; align-items:center; justify-content:center; color:white; }
        .incoming-call { position: fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#242424; border-radius:20px; padding:20px; z-index:1100; display:none; text-align:center; min-width:280px; }
        .notification { position: fixed; top:20px; left:50%; transform:translateX(-50%); background:#0084ff; padding:10px 20px; border-radius:30px; z-index:10000; display:none; font-size:13px; }
        .nav-footer { display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #222; }
        .nav-item { text-align: center; color: #888; cursor: pointer; }
        .nav-item.active { color: #0084ff; }
        .nav-item i { font-size: 20px; display: block; }
        .nav-item span { font-size: 11px; margin-top: 4px; }
        .loading-spinner { display: inline-block; width:20px; height:20px; border:3px solid #f3f3f3; border-top:3px solid #0084ff; border-radius:50%; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
        .input-field { width:90%; padding:10px; border-radius:25px; border:none; background:#242424; color:white; margin:5px auto; display:block; }
        .dropdown-list { background:#242424; border-radius:12px; margin-top:5px; max-height:200px; overflow-y:auto; position:absolute; width:80%; left:10%; }
        .dropdown-item { padding:10px; cursor:pointer; display:flex; align-items:center; gap:10px; border-bottom:1px solid #333; }
    </style>
</head>
<body>

<div id="loginScreen" class="app-container" style="justify-content: center; align-items: center; text-align: center;">
    <h1 style="color:#0084ff;">Messenger Pro</h1>
    <p style="color:#ccc;">نظام التواصل الداخلي السحابي</p>
    <div id="statusBar" style="margin:20px 0;"><span class="loading-spinner"></span> جاري التحميل...</div>
    <div id="searchPhase" style="display:none; width:100%;">
        <input type="text" id="loginSearch" class="input-field" placeholder="🔍 اكتب اسم الموظف..." oninput="searchEmployees()">
        <div id="searchDropdown" class="dropdown-list"></div>
    </div>
    <div id="credentialsPhase" style="display:none;">
        <p id="selectedEmpName"></p>
        <input type="password" id="passInput" class="input-field" placeholder="الرقم الوظيفي">
        <button id="verifyIdBtn" style="background:#0084ff; border:none; padding:10px 20px; border-radius:25px; color:white; margin-top:10px;">تحقق</button>
        <button id="backToSearch1" style="background:none; border:none; color:#0084ff; margin-top:10px;">↩ العودة</button>
    </div>
    <div id="passwordPhase" style="display:none;">
        <p>كلمة مرور جديدة</p>
        <input type="password" id="newPassword" class="input-field" placeholder="كلمة المرور">
        <input type="password" id="confirmPassword" class="input-field" placeholder="تأكيد">
        <label style="margin:10px 0; display:block;"><input type="checkbox" id="rememberMeCheckbox"> تذكرني</label>
        <button id="setPasswordBtn" style="background:#0084ff; border:none; padding:10px 20px; border-radius:25px; color:white;">دخول</button>
        <button id="backToSearch2" style="background:none; border:none; color:#0084ff; margin-top:10px;">↩ العودة</button>
    </div>
</div>

<div class="app-container" id="app" style="display: none;">
    <header><h1>messenger</h1><div class="header-icons"><i class="fas fa-cog" id="settingsIcon"></i><i class="fas fa-sign-out-alt" id="logoutBtn"></i></div></header>
    <div class="active-users-section" id="storiesContainer"></div>
    <div class="chats-container" id="chatsList"></div>
    <div class="nav-footer"><div class="nav-item active" data-section="chats"><i class="fas fa-comment"></i><span>الدردشات</span></div><div class="nav-item" data-section="posts"><i class="fas fa-newspaper"></i><span>المنشورات</span></div></div>
</div>

<div id="chatScreen" class="chat-screen">
    <div class="chat-header"><button class="back-btn" id="closeChatBtn"><i class="fas fa-arrow-right"></i></button><img id="chatHeaderImg"><div style="flex:1;"><strong id="chatHeaderName"></strong><div id="chatOnlineStatus" style="font-size:11px;"></div></div><div class="call-buttons"><button class="call-btn" id="voiceCallBtn"><i class="fas fa-phone-alt"></i></button><button class="call-btn" id="videoCallBtn"><i class="fas fa-video"></i></button></div><i class="fas fa-trash-alt" id="deleteChatBtn" style="color:#d32f2f; display:none;"></i></div>
    <div class="messages-container" id="messagesContainer"></div>
    <div class="input-area"><div class="input-wrapper"><input type="text" id="msgInput" placeholder="اكتب رسالة..." onkeypress="handleEnterKey(event)"></div><i class="fas fa-paper-plane" id="sendBtn" style="color:#0084ff; font-size:22px; cursor:pointer;"></i></div>
</div>

<div id="callOverlay" class="call-overlay"><div id="callPartnerName"></div><div id="callStatus">جاري الاتصال...</div><video id="remoteVideo" style="width:90%; max-width:350px; background:#000; border-radius:20px; margin:10px 0;" autoplay playsinline></video><video id="localVideo" style="position:absolute; bottom:70px; right:20px; width:100px; border-radius:10px; border:2px solid white;" autoplay playsinline muted></video><div style="margin-top:20px; display:flex; gap:20px;"><button id="micBtn" style="background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:55px; height:55px; color:white;"><i class="fas fa-microphone"></i></button><button id="hangupBtn" style="background:#f44336; border:none; border-radius:50%; width:65px; height:65px; color:white;"><i class="fas fa-phone-slash"></i></button><button id="camBtn" style="background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:55px; height:55px; color:white;"><i class="fas fa-video"></i></button></div></div>
<div id="incomingCall" class="incoming-call"></div>
<div id="notification" class="notification"></div>
<div id="settingsModal" style="position:fixed; top:50%; left:50%; transform:translate(-50%,-50%); background:#242424; border-radius:20px; padding:20px; z-index:3000; display:none; width:90%;"><h3 style="text-align:center;">الإعدادات</h3><button onclick="changeAvatar()" style="width:100%; padding:12px; margin:8px 0; background:#333; border:none; border-radius:12px; color:white;">تغيير الصورة</button><button onclick="logout()" style="width:100%; padding:12px; margin:8px 0; background:#333; border:none; border-radius:12px; color:#f44336;">تسجيل الخروج</button><button onclick="closeSettings()" style="width:100%; padding:12px; margin:8px 0; background:#333; border:none; border-radius:12px; color:white;">إغلاق</button></div>
<input type="file" id="avatarInput" accept="image/*" style="display:none;" onchange="updateAvatar(event)">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // ======================= SUPABASE =======================
    const SUPABASE_URL = 'https://nfywbkvsvmhaczfatxkp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VZMRpated19TvFgjTuf1Lw_uW7dOiHY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentUser = null;
    let activeChat = null;
    let allEmployees = []; // للعرض فقط
    let presenceChannel = null;
    let messagesChannel = null;
    let postsChannel = null;
    let unreadCounts = {}; // سيتم جلبه من قاعدة بيانات لاحقاً
    
    // WebRTC
    let localStream = null, peerConnection = null;
    let isCallActive = false, currentCallType = null, targetUser = null;
    let pendingOffer = null, pendingFrom = null, pendingType = null;
    let signalingChannel = null;
    
    const CSV_URL = 'https://raw.githubusercontent.com/adel423/myschoolpro/refs/heads/main/employees.csv';
    
    // ======================= تحميل الموظفين من CSV وتسجيلهم في Supabase =======================
    async function loadEmployeesFromCSV() {
        try {
            const res = await fetch(CSV_URL);
            if (!res.ok) throw new Error('CSV not found');
            const text = await res.text();
            let clean = text.charCodeAt(0) === 0xFEFF ? text.slice(1) : text;
            const lines = clean.split('\n').filter(l=>l.trim());
            let start = lines[0].includes('الرقم') ? 1 : 0;
            const employees = [];
            for(let i=start; i<lines.length; i++) {
                const parts = lines[i].trim().split(';');
                if(parts.length>=2) employees.push({ id: parts[0].trim(), name: parts[1].trim(), job: parts[2]?.trim() || 'موظف' });
            }
            // إدراج في جدول profiles إذا لم يكونوا موجودين
            for(const emp of employees) {
                const { data: existing } = await supabase.from('profiles').select('id').eq('id', emp.id).maybeSingle();
                if(!existing) {
                    await supabase.from('profiles').insert({ id: emp.id, name: emp.name, job: emp.job, avatar_url: null });
                }
            }
            allEmployees = employees;
            document.getElementById('statusBar').innerHTML = `✅ تم تحميل ${allEmployees.length} موظف`;
            document.getElementById('searchPhase').style.display = 'block';
            document.getElementById('statusBar').style.display = 'none';
        } catch(e) {
            document.getElementById('statusBar').innerHTML = '❌ فشل تحميل CSV';
        }
    }
    
    // ======================= تسجيل الدخول =======================
    window.searchEmployees = function() {
        const q = document.getElementById('loginSearch').value.trim();
        const drop = document.getElementById('searchDropdown');
        if(!q) { drop.style.display='none'; return; }
        const matches = allEmployees.filter(e=>e.name.includes(q));
        drop.innerHTML = matches.map(emp=>`<div class="dropdown-item" onclick="selectEmployee('${emp.id}')"><div style="width:40px;height:40px;background:#0084ff;border-radius:50%;display:flex;align-items:center;justify-content:center;">${emp.name.charAt(0)}</div><div><strong>${emp.name}</strong><br><small>${emp.job}</small></div></div>`).join('');
        drop.style.display = 'block';
    };
    let selectedEmployee = null;
    window.selectEmployee = function(id) {
        selectedEmployee = allEmployees.find(e=>e.id===id);
        document.getElementById('selectedEmpName').innerHTML = `👤 ${selectedEmployee.name}<br><small>${selectedEmployee.job}</small>`;
        document.getElementById('searchPhase').style.display = 'none';
        document.getElementById('credentialsPhase').style.display = 'block';
        document.getElementById('searchDropdown').style.display = 'none';
    };
    document.getElementById('verifyIdBtn').onclick = async () => {
        const pass = document.getElementById('passInput').value;
        if(pass === selectedEmployee.id) {
            // التحقق من وجود كلمة مرور في supabase
            const { data: profile } = await supabase.from('profiles').select('password_hash').eq('id', selectedEmployee.id).single();
            if(!profile || !profile.password_hash) {
                document.getElementById('credentialsPhase').style.display = 'none';
                document.getElementById('passwordPhase').style.display = 'block';
            } else {
                // كلمة مرور موجودة، نطلب منها
                const pwd = prompt('أدخل كلمة المرور الخاصة بك:');
                // في الحقيقة يجب مقارنة hash، لكن للتبسيط نقارن نص عادي (وليس آمناً)
                // يجب استخدام bcrypt على السيرفر، لكننا سنستخدم نص عادي للتوضيح
                if(pwd === profile.password_hash) {
                    currentUser = selectedEmployee;
                    startApp();
                } else alert('كلمة مرور خاطئة');
            }
        } else alert('الرقم الوظيفي غير صحيح');
    };
    document.getElementById('setPasswordBtn').onclick = async () => {
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        if(newPass.length<3) { alert('قصيرة'); return; }
        if(newPass !== confirmPass) { alert('غير متطابقة'); return; }
        await supabase.from('profiles').update({ password_hash: newPass }).eq('id', selectedEmployee.id);
        currentUser = selectedEmployee;
        if(document.getElementById('rememberMeCheckbox').checked) localStorage.setItem('remembered_id', currentUser.id);
        startApp();
    };
    document.getElementById('backToSearch1').onclick = () => { document.getElementById('credentialsPhase').style.display='none'; document.getElementById('searchPhase').style.display='block'; };
    document.getElementById('backToSearch2').onclick = () => { document.getElementById('passwordPhase').style.display='none'; document.getElementById('searchPhase').style.display='block'; };
    
    async function checkAutoLogin() {
        const remembered = localStorage.getItem('remembered_id');
        if(remembered && allEmployees.length) {
            const emp = allEmployees.find(e=>e.id===remembered);
            if(emp) {
                const { data: profile } = await supabase.from('profiles').select('password_hash').eq('id', emp.id).single();
                if(profile?.password_hash) {
                    const pwd = prompt(`مرحباً ${emp.name}، أدخل كلمة المرور:`);
                    if(pwd === profile.password_hash) {
                        currentUser = emp;
                        startApp();
                    }
                }
            }
        }
    }
    
    // ======================= بدء التطبيق (مع realtime) =======================
    async function startApp() {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        await initRealtime();
        await initPresence();
        await initSignaling();
        renderStories();
        await loadChatsList();
        renderPosts();
        setInterval(()=>{ updatePresence(); }, 30000);
        showNotification(`مرحباً ${currentUser.name}`);
    }
    
    async function initRealtime() {
        if(messagesChannel) await supabase.removeChannel(messagesChannel);
        messagesChannel = supabase.channel('messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async (payload) => {
                const msg = payload.new;
                if(activeChat && (msg.chat_id === getChatId(activeChat.id) || (activeChat.id==='group' && msg.chat_id==='group'))) {
                    await loadMessages(getChatId(activeChat.id));
                }
                if(msg.sender !== currentUser.id) {
                    // زيادة عدد غير مقروء
                    await incrementUnread(msg.chat_id);
                    await loadChatsList();
                    showNotification(`رسالة جديدة من ${allEmployees.find(e=>e.id===msg.sender)?.name}`, '💬');
                }
            }).subscribe();
        
        if(postsChannel) await supabase.removeChannel(postsChannel);
        postsChannel = supabase.channel('posts')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => renderPosts())
            .subscribe();
    }
    
    async function initPresence() {
        if(presenceChannel) await supabase.removeChannel(presenceChannel);
        presenceChannel = supabase.channel('online-users', { config: { presence: { key: currentUser.id } } });
        presenceChannel.on('presence', { event: 'sync' }, () => {
            renderStories();
            loadChatsList();
        }).subscribe(async (status) => {
            if(status === 'SUBSCRIBED') await presenceChannel.track({ user_id: currentUser.id, name: currentUser.name });
        });
    }
    
    function getOnlineUsers() {
        if(!presenceChannel) return new Set();
        const state = presenceChannel.presenceState();
        const users = new Set();
        for(const key in state) if(key !== currentUser.id) users.add(key);
        return users;
    }
    
    function isUserOnline(userId) {
        return getOnlineUsers().has(userId);
    }
    
    async function updatePresence() {
        if(presenceChannel) await presenceChannel.track({ user_id: currentUser.id, name: currentUser.name });
    }
    
    async function incrementUnread(chatId) {
        // نستخدم جدول unread_counts
        const { data: existing } = await supabase.from('unread_counts').select('count').eq('user_id', currentUser.id).eq('chat_id', chatId).maybeSingle();
        if(existing) {
            await supabase.from('unread_counts').update({ count: existing.count+1 }).eq('user_id', currentUser.id).eq('chat_id', chatId);
        } else {
            await supabase.from('unread_counts').insert({ user_id: currentUser.id, chat_id: chatId, count: 1 });
        }
        await loadChatsList();
    }
    
    async function markAsRead(chatId) {
        await supabase.from('unread_counts').delete().eq('user_id', currentUser.id).eq('chat_id', chatId);
        await loadChatsList();
    }
    
    async function getUnreadCount(chatId) {
        const { data } = await supabase.from('unread_counts').select('count').eq('user_id', currentUser.id).eq('chat_id', chatId).maybeSingle();
        return data ? data.count : 0;
    }
    
    // ======================= عرض المتصلين (فقط المتصلين) =======================
    function renderStories() {
        const container = document.getElementById('storiesContainer');
        const onlineIds = getOnlineUsers();
        const onlineEmployees = allEmployees.filter(e => e.id !== currentUser.id && onlineIds.has(e.id));
        let html = `<div class="user-story" onclick="changeAvatar()"><div class="avatar-container"><img src="${getAvatar(currentUser.id)}"><div style="position:absolute; bottom:0; right:0; background:#242424; border-radius:50%; width:20px; height:20px; display:flex; justify-content:center; align-items:center; border:2px solid #000;">+</div></div><span>حسابي</span></div>`;
        html += onlineEmployees.map(emp => `<div class="user-story" onclick="openChat('${emp.id}','${emp.name}')"><div class="avatar-container"><img src="${getAvatar(emp.id)}"><div class="online-dot"></div></div><span>${emp.name.split(' ')[0]}</span></div>`).join('');
        container.innerHTML = html;
    }
    
    function getAvatar(userId) {
        return `https://ui-avatars.com/api/?name=${userId}&background=0084ff&color=fff&size=100`;
    }
    
    window.changeAvatar = function() { alert('تغيير الصورة سيتم عبر رفع ملف إلى Storage قريباً'); };
    window.updateAvatar = function() {};
    
    // ======================= الدردشات =======================
    function getChatId(userId) { return [currentUser.id, userId].sort().join('_'); }
    
    async function loadChatsList() {
        const container = document.getElementById('chatsList');
        // جلب جميع المحادثات التي توجد بها رسائل
        const { data: messagesData } = await supabase.from('messages').select('chat_id').or(`sender.eq.${currentUser.id},receiver.eq.${currentUser.id}`).order('created_at', { ascending: false });
        const uniqueChats = new Set();
        for(const m of messagesData) uniqueChats.add(m.chat_id);
        const chats = [];
        for(const chatId of uniqueChats) {
            const otherId = chatId.split('_').find(id => id !== currentUser.id);
            if(!otherId) continue;
            const emp = allEmployees.find(e=>e.id===otherId);
            if(!emp) continue;
            const { data: lastMsg } = await supabase.from('messages').select('text, created_at').eq('chat_id', chatId).order('created_at', { ascending: false }).limit(1);
            const unread = await getUnreadCount(chatId);
            chats.push({ emp, lastMsg: lastMsg?.[0]?.text || '', lastTime: lastMsg?.[0]?.created_at || 0, unread, isOnline: isUserOnline(otherId) });
        }
        chats.sort((a,b) => new Date(b.lastTime) - new Date(a.lastTime));
        container.innerHTML = chats.map(c => `
            <div class="chat-item" onclick="openChat('${c.emp.id}','${c.emp.name}')">
                <img src="${getAvatar(c.emp.id)}">
                <div class="chat-details">
                    <div class="chat-name">${c.emp.name} ${c.isOnline ? '<span class="online-status">🟢 متصل</span>' : '<span class="offline-status">⚫ غير متصل</span>'} ${c.unread>0 ? `<span class="unread-badge">${c.unread}</span>` : ''}</div>
                    <div class="chat-message">${c.lastMsg.substring(0,40)}</div>
                </div>
            </div>
        `).join('');
    }
    
    window.openChat = async function(userId, userName) {
        activeChat = { id: userId, name: userName };
        const chatId = getChatId(userId);
        await markAsRead(chatId);
        document.getElementById('chatHeaderName').innerText = userName;
        document.getElementById('chatHeaderImg').src = getAvatar(userId);
        document.getElementById('chatOnlineStatus').innerHTML = isUserOnline(userId) ? '🟢 متصل' : '⚫ غير متصل';
        document.getElementById('deleteChatBtn').style.display = currentUser.id === '1098107010228600' ? 'inline-block' : 'none';
        document.getElementById('app').style.display = 'none';
        document.getElementById('chatScreen').style.display = 'flex';
        await loadMessages(chatId);
    };
    
    async function loadMessages(chatId) {
        const { data } = await supabase.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
        const container = document.getElementById('messagesContainer');
        if(!data?.length) { container.innerHTML = '<div style="text-align:center;margin-top:50px;color:gray;">✨ لا توجد رسائل</div>'; return; }
        container.innerHTML = data.map(msg => {
            const isMine = msg.sender === currentUser.id;
            const time = new Date(msg.created_at).toLocaleTimeString('ar', { hour:'2-digit', minute:'2-digit' });
            return `<div class="message ${isMine ? 'sent' : 'received'}"><div class="bubble">${escapeHtml(msg.text)}</div><div class="msg-time">${time}</div></div>`;
        }).join('');
        setTimeout(() => container.scrollTop = container.scrollHeight, 100);
    }
    
    async function sendMessage() {
        const input = document.getElementById('msgInput');
        const text = input.value.trim();
        if(!text || !activeChat) return;
        const chatId = getChatId(activeChat.id);
        await supabase.from('messages').insert({ chat_id: chatId, sender: currentUser.id, text, created_at: new Date().toISOString() });
        input.value = '';
        await loadMessages(chatId);
        await loadChatsList();
    }
    window.handleEnterKey = function(e) { if(e.key === 'Enter') sendMessage(); };
    document.getElementById('sendBtn').onclick = sendMessage;
    document.getElementById('closeChatBtn').onclick = () => { activeChat = null; document.getElementById('chatScreen').style.display = 'none'; document.getElementById('app').style.display = 'flex'; loadChatsList(); };
    
    // ======================= المنشورات =======================
    async function renderPosts() {
        const container = document.getElementById('chatsList'); // مؤقتاً
        const { data: posts } = await supabase.from('posts').select('*, profiles(name)').order('created_at', { ascending: false });
        if(!posts?.length) { container.innerHTML = '<div style="padding:20px; text-align:center;">لا توجد منشورات</div>'; return; }
        let html = `<div style="padding:10px;"><textarea id="newPostText" style="width:100%; background:#242424; border:none; border-radius:12px; padding:10px; color:white;" placeholder="منشور جديد..."></textarea><button onclick="createPost()" style="background:#0084ff; border:none; padding:8px; border-radius:20px; margin-top:5px; width:100%;">نشر</button></div>`;
        html += posts.map(p => `
            <div style="background:#111; margin:10px 0; padding:12px; border-radius:12px;">
                <div style="display:flex; align-items:center; gap:8px;"><img src="${getAvatar(p.user_id)}" style="width:40px; border-radius:50%;"><strong>${p.profiles?.name || p.user_id}</strong></div>
                <div style="margin:10px 0;">${escapeHtml(p.text)}</div>
                <div style="display:flex; gap:15px;"><span onclick="toggleLike('${p.id}')"><i class="fas fa-heart" style="color:${p.liked ? '#e91e63' : 'gray'}"></i> ${p.likes_count||0}</span></div>
            </div>
        `).join('');
        container.innerHTML = html;
    }
    window.createPost = async function() {
        const text = document.getElementById('newPostText')?.value;
        if(!text) return;
        await supabase.from('posts').insert({ user_id: currentUser.id, text, created_at: new Date().toISOString() });
        renderPosts();
    };
    window.toggleLike = async function(postId) { alert('إعجاب قيد التطوير'); };
    
    // ======================= المكالمات (WebRTC) =======================
    async function initSignaling() {
        if(signalingChannel) await supabase.removeChannel(signalingChannel);
        signalingChannel = supabase.channel('signaling')
            .on('broadcast', { event: 'offer' }, async ({ payload }) => {
                if(payload.target === currentUser.id && !isCallActive) {
                    pendingOffer = payload.sdp; pendingFrom = payload.from; pendingType = payload.type;
                    showIncomingCall(payload.from, payload.type);
                }
            })
            .on('broadcast', { event: 'answer' }, async ({ payload }) => {
                if(payload.target === currentUser.id && peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
            })
            .on('broadcast', { event: 'ice' }, async ({ payload }) => {
                if(payload.target === currentUser.id && peerConnection) await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
            })
            .on('broadcast', { event: 'end' }, () => { hangUp(false); document.getElementById('incomingCall').style.display='none'; })
            .subscribe();
    }
    async function startCall(type) {
        if(!activeChat) { showNotification('اختر محادثة أولاً'); return; }
        targetUser = allEmployees.find(e=>e.id===activeChat.id);
        if(!targetUser) return;
        currentCallType = type; isCallActive = true;
        await setupCall(false);
    }
    async function setupCall(isAnswer) {
        try {
            const constraints = { audio: true, video: currentCallType === 'video' };
            localStream = await navigator.mediaDevices.getUserMedia(constraints);
            document.getElementById('localVideo').srcObject = localStream;
            document.getElementById('callOverlay').style.display = 'flex';
            document.getElementById('callPartnerName').innerText = targetUser.name;
            const config = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
            peerConnection = new RTCPeerConnection(config);
            localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
            peerConnection.ontrack = e => { if(e.streams[0]) document.getElementById('remoteVideo').srcObject = e.streams[0]; };
            peerConnection.onicecandidate = e => { if(e.candidate) signalingChannel.send({ type:'broadcast', event:'ice', payload:{ candidate:e.candidate, target:targetUser.id } }); };
            if(isAnswer) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                signalingChannel.send({ type:'broadcast', event:'answer', payload:{ sdp:peerConnection.localDescription, from:currentUser.id, target:targetUser.id } });
            } else {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                signalingChannel.send({ type:'broadcast', event:'offer', payload:{ sdp:peerConnection.localDescription, from:currentUser.id, target:targetUser.id, type:currentCallType } });
            }
        } catch(err) { showNotification('فشل الوصول للكاميرا'); hangUp(true); }
    }
    function hangUp(sendSignal=true) {
        if(peerConnection) peerConnection.close();
        if(localStream) localStream.getTracks().forEach(t=>t.stop());
        if(sendSignal && targetUser) signalingChannel.send({ type:'broadcast', event:'end', payload:{ target:targetUser.id } });
        document.getElementById('callOverlay').style.display = 'none';
        isCallActive = false; targetUser = null; peerConnection = null;
    }
    function showIncomingCall(fromId, type) {
        const fromEmp = allEmployees.find(e=>e.id===fromId);
        const div = document.getElementById('incomingCall');
        div.innerHTML = `<div><h3>📞 مكالمة من ${fromEmp?.name}</h3><p>${type==='video'?'فيديو':'صوت'}</p><button id="acceptCallBtn" style="background:#10b981; padding:8px 16px; margin:5px;">قبول</button><button id="rejectCallBtn" style="background:#f44336; padding:8px 16px;">رفض</button></div>`;
        div.style.display = 'block';
        document.getElementById('acceptCallBtn').onclick = async () => {
            div.style.display='none'; targetUser = fromEmp; currentCallType=type; isCallActive=true; await setupCall(true);
        };
        document.getElementById('rejectCallBtn').onclick = () => { div.style.display='none'; signalingChannel.send({ type:'broadcast', event:'end', payload:{ target:fromId } }); };
        setTimeout(()=>{ if(div.style.display==='block') div.style.display='none'; }, 30000);
    }
    document.getElementById('voiceCallBtn').onclick = () => startCall('audio');
    document.getElementById('videoCallBtn').onclick = () => startCall('video');
    document.getElementById('hangupBtn').onclick = () => hangUp(true);
    document.getElementById('micBtn').onclick = () => { if(localStream) { const t = localStream.getAudioTracks()[0]; if(t){ t.enabled=!t.enabled; document.getElementById('micBtn').innerHTML = t.enabled?'<i class="fas fa-microphone"></i>':'<i class="fas fa-microphone-slash"></i>'; } } };
    document.getElementById('camBtn').onclick = () => { if(localStream) { const t = localStream.getVideoTracks()[0]; if(t){ t.enabled=!t.enabled; document.getElementById('camBtn').innerHTML = t.enabled?'<i class="fas fa-video"></i>':'<i class="fas fa-video-slash"></i>'; } } };
    
    // ======================= أدوات عامة =======================
    function showNotification(msg, icon='🔔') {
        const n = document.getElementById('notification');
        n.innerHTML = `${icon} ${msg}`;
        n.style.display = 'block';
        setTimeout(()=> n.style.display='none', 3000);
    }
    function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }
    document.getElementById('settingsIcon').onclick = () => document.getElementById('settingsModal').style.display='block';
    window.closeSettings = () => document.getElementById('settingsModal').style.display='none';
    window.logout = () => { localStorage.removeItem('remembered_id'); location.reload(); };
    document.getElementById('logoutBtn').onclick = () => logout();
    document.querySelectorAll('.nav-item').forEach(item => {
        item.onclick = () => {
            document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
            item.classList.add('active');
            if(item.dataset.section === 'chats') { document.getElementById('chatsList').style.display='block'; loadChatsList(); }
            else { document.getElementById('chatsList').style.display='block'; renderPosts(); }
        };
    });
    
    // بدء التشغيل
    async function init() {
        await loadEmployeesFromCSV();
        await checkAutoLogin();
        if(!currentUser) {
            document.getElementById('searchPhase').style.display = 'block';
            document.getElementById('statusBar').style.display = 'none';
        }
    }
    init();
</script>
