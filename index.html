<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Messenger Pro - المؤسسة (صوت + فيديو + سجل محلي)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sky-bg: #e1f5fe;
            --card-bg: #ffffff;
            --primary: #0288d1;
            --primary-light: #4fc3f7;
            --secondary: #01579b;
            --text-dark: #0a2f44;
            --text-muted: #546e7a;
            --bubble-sent: #81d4fa;
            --bubble-received: #ffffff;
            --online-dot: #2e7d32;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.05);
            --border-light: #cfd8dc;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--sky-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; }

        .login-screen {
            background: var(--card-bg);
            border-radius: 32px;
            box-shadow: var(--shadow-sm);
            max-width: 450px;
            width: 100%;
            padding: 20px;
            text-align: center;
        }
        .user-list { max-height: 300px; overflow-y: auto; margin: 15px 0; border-radius: 20px; border: 1px solid var(--border-light); }
        .user-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid var(--border-light); cursor: pointer; transition: 0.2s; }
        .user-item.selected { background: var(--primary-light); border-right: 4px solid var(--primary); }
        .user-avatar-img { width: 45px; height: 45px; border-radius: 50%; margin-left: 12px; object-fit: cover; }
        .search-box { width: 100%; padding: 12px; border-radius: 30px; border: 1px solid var(--border-light); background: white; outline: none; margin-bottom: 10px; }
        .input-wrapper { position: relative; margin: 10px auto; }
        .voice-btn { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-muted); cursor: pointer; }
        .login-btn { padding: 12px 40px; border-radius: 30px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; display: none; margin-top: 8px; }
        .admin-panel { background: var(--card-bg); border: 1px solid #ffb300; padding: 15px; border-radius: 20px; display: none; margin-top: 10px; }
        .admin-panel input, .admin-panel button { margin-top: 8px; width: 100%; padding: 10px; border-radius: 12px; border: 1px solid var(--border-light); }
        .btn-add { background: #10b981; color: white; border: none; cursor: pointer; }
        .btn-cancel { background: #f44336; color: white; border: none; cursor: pointer; }
        .employee-delete-item { display: flex; justify-content: space-between; align-items: center; background: #f1f5f9; margin: 6px 0; padding: 6px 10px; border-radius: 20px; font-size: 13px; }
        .del-emp-btn { background: #f44336; border: none; color: white; border-radius: 20px; padding: 2px 10px; cursor: pointer; font-size: 11px; }

        #app {
            display: none;
            max-width: 500px;
            width: 100%;
            height: 90vh;
            background: var(--sky-bg);
            border-radius: 32px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            position: relative;
            flex-direction: column;
        }
        .main-header { padding: 12px 16px; background: var(--card-bg); display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-light); }
        .main-header h2 { font-size: 22px; color: var(--secondary); }
        .online-bar { display: flex; padding: 10px; gap: 12px; overflow-x: auto; background: transparent; }
        .online-user { display: flex; flex-direction: column; align-items: center; min-width: 60px; cursor: pointer; }
        .story-avatar { width: 55px; height: 55px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary); padding: 2px; background: white; }
        .active-dot { width: 12px; height: 12px; background: var(--online-dot); border: 2px solid white; border-radius: 50%; position: absolute; bottom: 5px; right: 5px; }
        .chats-list { flex: 1; overflow-y: auto; padding: 8px; }
        .chat-row { display: flex; padding: 10px; background: var(--card-bg); border-radius: 16px; margin-bottom: 8px; align-items: center; cursor: pointer; box-shadow: var(--shadow-sm); }
        .chat-info { margin-right: 10px; flex: 1; }
        .chat-info h5 { font-size: 14px; margin-bottom: 2px; }
        .chat-info p { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-time { font-size: 10px; color: var(--text-muted); }

        .chat-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: var(--sky-bg); z-index: 100; display: none; flex-direction: column; }
        .chat-header { display: flex; align-items: center; padding: 10px; background: var(--card-bg); border-bottom: 1px solid var(--border-light); }
        .back-btn { color: var(--primary); font-size: 20px; padding: 8px; cursor: pointer; background: none; border: none; }
        .messages-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 6px; }
        .message { display: flex; flex-direction: column; max-width: 75%; margin-bottom: 8px; }
        .message.sent { align-self: flex-end; align-items: flex-end; }
        .message.received { align-self: flex-start; }
        .sender-name { font-size: 10px; color: var(--primary); margin-bottom: 2px; margin-right: 8px; }
        .bubble { padding: 8px 14px; border-radius: 18px; font-size: 14px; background: var(--bubble-received); color: var(--text-dark); position: relative; }
        .sent .bubble { background: var(--bubble-sent); border-bottom-right-radius: 4px; }
        .received .bubble { background: white; border-bottom-left-radius: 4px; }
        .message-time { font-size: 9px; color: var(--text-muted); margin-top: 3px; display: flex; gap: 5px; }
        .msg-actions { position: absolute; top: 2px; left: 4px; display: none; gap: 5px; background: rgba(0,0,0,0.6); padding: 2px 4px; border-radius: 20px; }
        .bubble:hover .msg-actions { display: flex; }

        .input-area { display: flex; align-items: center; padding: 8px; gap: 8px; background: var(--card-bg); border-top: 1px solid var(--border-light); }
        .tool-icons { display: flex; gap: 10px; color: var(--primary); font-size: 18px; }
        .input-wrapper.custom { flex: 1; background: white; border-radius: 30px; display: flex; align-items: center; padding: 4px 12px; border: 1px solid var(--border-light); }
        .input-wrapper.custom input { flex: 1; background: transparent; border: none; outline: none; padding: 8px; font-size: 14px; }
        .quick-action { color: var(--primary); font-size: 22px; cursor: pointer; }
        .typing-indicator { font-size: 10px; color: var(--text-muted); padding: 4px 12px; font-style: italic; }

        #callsScreen { display: none; height: 100%; overflow-y: auto; background: var(--sky-bg); padding: 12px; }
        .call-item { display: flex; align-items: center; padding: 10px; background: var(--card-bg); border-radius: 16px; margin-bottom: 8px; }
        .call-icon { width: 40px; text-align: center; font-size: 18px; }
        .call-icon.missed { color: #f44336; }
        .call-details { flex: 1; margin-right: 10px; }
        .rappeler-btn { background: none; border: 1px solid var(--primary); border-radius: 20px; padding: 3px 8px; font-size: 11px; cursor: pointer; color: var(--primary); }

        .call-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.85); z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .call-container { width: 90%; max-width: 500px; background: var(--card-bg); border-radius: 24px; overflow: hidden; }
        .call-header { background: var(--primary); padding: 12px; text-align: center; color: white; }
        .call-video { position: relative; background: #000; min-height: 250px; }
        .remote-video { width: 100%; height: 100%; background: #222; }
        .local-video { position: absolute; bottom: 10px; right: 10px; width: 80px; border-radius: 10px; border: 2px solid white; }
        .call-controls { display: flex; justify-content: center; gap: 15px; padding: 12px; background: white; }
        .call-controls button { width: 45px; height: 45px; border-radius: 50%; border: none; font-size: 18px; cursor: pointer; }
        .hangup-btn { background: #f44336; color: white; }
        .incoming-call { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--card-bg); border-radius: 20px; display: none; z-index: 1001; box-shadow: 0 4px 20px rgba(0,0,0,0.2); overflow: hidden; width: 90%; max-width: 350px; }
        .incoming-call-content { padding: 20px; text-align: center; }
        .incoming-call h3 { margin-bottom: 10px; }
        .incoming-call-buttons { display: flex; gap: 20px; justify-content: center; margin-top: 15px; }
        .incoming-call-buttons button { padding: 12px 24px; border: none; border-radius: 50px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .accept-call { background: #10b981; color: white; }
        .reject-call { background: #f44336; color: white; }

        .bottom-nav { display: flex; justify-content: space-around; padding: 8px; background: var(--card-bg); border-top: 1px solid var(--border-light); }
        .nav-item { text-align: center; color: var(--text-muted); font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 6px 16px; border-radius: 30px; z-index: 10000; display: none; font-size: 12px; }
        .logout-icon { cursor: pointer; color: var(--text-muted); font-size: 20px; transition: 0.2s; }
        .logout-icon:hover { color: #f44336; }
        
        /* تحسينات إضافية */
        .fa-edit, .fa-camera { cursor: pointer; }
        .typing-dots { display: flex; gap: 3px; padding: 4px 12px; }
        .typing-dots span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: typing 1.4s infinite; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }
    </style>
</head>
<body>

<div id="loginScreen" class="login-screen">
    <h1 style="color: var(--secondary); margin-bottom: 16px;">Messenger Pro</h1>
    <div id="statusBar" style="color: var(--text-muted); font-size:12px;">⏳ جاري التحميل...</div>
    <div class="input-wrapper">
        <input type="text" id="loginSearch" class="search-box" placeholder="🔍 ابحث عن اسمك" oninput="window.filterLoginUsers()">
        <button class="voice-btn" id="voiceSearchBtn"><i class="fas fa-microphone"></i></button>
    </div>
    <div class="user-list" id="loginUserList"></div>
    <input type="password" id="passInput" placeholder="أدخل الرقم الوظيفي" style="padding:10px; border-radius:30px; border:1px solid var(--border-light); width:100%; margin-bottom:8px; display:none; background:white;">
    <button id="loginBtn" class="login-btn">دخول</button>
    <div class="admin-panel" id="adminPanel">
        <h4 style="color: var(--secondary);">إدارة الموظفين</h4>
        <input type="text" id="newEmpName" placeholder="الاسم الكامل">
        <input type="text" id="newEmpId" placeholder="الرقم الوظيفي">
        <input type="text" id="newEmpJob" placeholder="المسمى الوظيفي">
        <button class="btn-add" onclick="window.addEmployee()">إضافة موظف</button>
        <div id="empDeleteList" style="margin-top:12px; max-height:150px; overflow-y:auto;"></div>
        <button class="btn-cancel" onclick="window.toggleAdminPanel()">إغلاق</button>
    </div>
</div>

<div id="app">
    <div id="mainView" style="display: flex; flex-direction: column; height: 100%;">
        <div class="main-header">
            <h2>المؤسسة</h2>
            <div class="icons" style="display: flex; gap: 12px;">
                <i class="fas fa-camera" id="changeAvatarBtn" style="color: var(--primary); cursor:pointer;"></i>
                <i class="fas fa-edit" id="adminIcon" style="color: var(--primary); cursor:pointer;"></i>
                <i class="fas fa-power-off logout-icon" id="logoutBtn"></i>
            </div>
        </div>
        <div class="online-bar" id="storiesContainer"></div>
        <div class="chats-list" id="chatsList"></div>
        <div class="bottom-nav">
            <div class="nav-item active" data-section="chats"><i class="fas fa-comment"></i><span>الدردشات</span></div>
            <div class="nav-item" data-section="calls"><i class="fas fa-phone"></i><span>المكالمات</span></div>
            <div class="nav-item" data-section="settings"><i class="fas fa-cog"></i><span>الإعدادات</span></div>
        </div>
    </div>

    <div id="callsScreen">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px; background: var(--card-bg); border-bottom: 1px solid var(--border-light);">
            <i class="fas fa-arrow-right" id="closeCallsBtn" style="color: var(--primary); font-size: 18px; cursor: pointer;"></i>
            <h3 style="margin:0; font-size: 16px;">سجل المكالمات (محلي)</h3>
        </div>
        <div id="callsList" style="padding: 8px;"></div>
    </div>

    <div id="chatScreen" class="chat-screen">
        <div class="chat-header">
            <button class="back-btn" id="closeChatBtn"><i class="fas fa-arrow-right"></i></button>
            <div style="flex:1; display:flex; align-items:center; gap:8px;">
                <img id="chatHeaderImg" style="width:32px; height:32px; border-radius:50%;">
                <h4 id="chatHeaderName" style="font-size: 14px;"></h4>
            </div>
            <div style="color:var(--primary); display:flex; gap:15px; font-size:16px;">
                <i class="fas fa-phone-alt" id="callAudioBtn"></i>
                <i class="fas fa-video" id="callVideoBtn"></i>
            </div>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="typing-indicator" id="typingIndicator" style="display: none;"></div>
        <div class="input-area">
            <div class="tool-icons"><i class="fas fa-image" id="pickImageBtn"></i></div>
            <div class="input-wrapper custom"><input type="text" id="msgInput" placeholder="Aa"></div>
            <div class="quick-action" id="sendBtn"><i class="fas fa-paper-plane"></i></div>
        </div>
    </div>
</div>

<div id="callOverlay" class="call-overlay">
    <div class="call-container">
        <div class="call-header"><span id="callPartnerName">اتصال</span></div>
        <div class="call-video">
            <video id="remoteVideo" class="remote-video" autoplay playsinline></video>
            <video id="localVideo" class="local-video" autoplay playsinline muted></video>
        </div>
        <div class="call-status" id="callStatus">⏳ جاري الاتصال...</div>
        <div class="call-controls">
            <button class="mic-btn" id="micBtn"><i class="fas fa-microphone"></i></button>
            <button class="cam-btn" id="camBtn"><i class="fas fa-video"></i></button>
            <button class="hangup-btn" id="hangupBtn"><i class="fas fa-phone-slash"></i></button>
        </div>
    </div>
</div>

<div id="incomingCall" class="incoming-call"></div>
<div id="notification" class="notification"></div>
<audio id="ringtone" preload="auto">
    <source src="https://www.soundjay.com/misc/sounds/bell-ringing-05.mp3" type="audio/mpeg">
</audio>
<audio id="notificationSound" preload="auto">
    <source src="https://www.soundjay.com/misc/sounds/notification-01.mp3" type="audio/mpeg">
</audio>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function() {
    const SUPABASE_URL = 'https://nfywbkvsvmhaczfatxkp.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_VZMRpated19TvFgjTuf1Lw_uW7dOiHY';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const DIRECTOR_ID = '1098107010228600';

    let allEmployees = [], currentUser = null, activeChat = null;
    let selectedIdForLogin = null;
    let presenceChannel = null, messagesChannel = null, signalingChannel = null, typingChannel = null;
    let peerConnection = null, localStream = null, isCallActive = false, callStartTime = null, currentCallType = null, targetUser = null, pendingOffer = null, pendingFrom = null, pendingType = null;
    let recognition = null;
    let typingTimeout = null;
    let isTyping = false;

    // أصوات
    function playRingtone() { try { let audio = document.getElementById('ringtone'); audio.volume = 0.7; audio.play().catch(e => console.log('صوت الرنين:', e)); } catch(e) {} }
    function stopRingtone() { try { let audio = document.getElementById('ringtone'); audio.pause(); audio.currentTime = 0; } catch(e) {} }
    function playNotificationSound() { try { let audio = document.getElementById('notificationSound'); audio.volume = 0.5; audio.play().catch(e => console.log('صوت الإشعار:', e)); } catch(e) {} }

    // طلب إذن الميكروفون والكاميرا
    async function requestMediaPermissions(videoEnabled) {
        try {
            let constraints = { audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } };
            if (videoEnabled) constraints.video = { width: { ideal: 640 }, height: { ideal: 480 } };
            let stream = await navigator.mediaDevices.getUserMedia(constraints);
            return stream;
        } catch(err) {
            console.error('فشل الوصول للميديا:', err);
            showNotif('❌ يرجى السماح بالوصول إلى الميكروفون والكاميرا', '⚠️');
            throw err;
        }
    }

    // ========== إدارة سجل المكالمات في localStorage ==========
    function getLocalCallLogs(userId) {
        let key = `call_logs_${userId}`;
        let logs = localStorage.getItem(key);
        return logs ? JSON.parse(logs) : [];
    }
    function saveLocalCallLogs(userId, logs) {
        localStorage.setItem(`call_logs_${userId}`, JSON.stringify(logs));
    }
    function addCallLog(callerId, calleeId, callType, answered, durationSec) {
        if (!currentUser) return;
        let logEntry = {
            id: Date.now() + '_' + Math.random().toString(36).substr(2, 6),
            caller_id: callerId,
            callee_id: calleeId,
            call_type: callType,
            answered: answered,
            missed: !answered,
            duration_seconds: durationSec || 0,
            timestamp: new Date().toISOString()
        };
        let callerLogs = getLocalCallLogs(callerId);
        callerLogs.unshift(logEntry);
        saveLocalCallLogs(callerId, callerLogs);
        if (callerId !== calleeId) {
            let calleeLogs = getLocalCallLogs(calleeId);
            calleeLogs.unshift(logEntry);
            saveLocalCallLogs(calleeId, calleeLogs);
        }
        if (document.getElementById('callsScreen').style.display === 'block') renderCallsLog();
    }
    async function renderCallsLog() {
        if (!currentUser) return;
        let logs = getLocalCallLogs(currentUser.id);
        let container = document.getElementById('callsList');
        if (!logs.length) { container.innerHTML = '<div style="text-align:center; padding:40px; color:var(--text-muted);">لا توجد مكالمات</div>'; return; }
        container.innerHTML = logs.map(log => {
            let partnerId = log.caller_id === currentUser.id ? log.callee_id : log.caller_id;
            let partner = allEmployees.find(e => e.id === partnerId);
            if (!partner) return '';
            let isMissed = log.missed === true;
            let icon = log.call_type === 'video' ? '<i class="fas fa-video"></i>' : '<i class="fas fa-phone-alt"></i>';
            return `<div class="call-item" onclick="window.openChat('${partner.id}','${partner.name}')">
                <div class="call-icon ${isMissed ? 'missed' : ''}">${icon}</div>
                <div class="call-details">
                    <div class="call-partner">${partner.name}</div>
                    <div class="call-info">${isMissed ? 'فائتة • ' : ''}${log.duration_seconds ? formatDuration(log.duration_seconds) + ' • ' : ''}${formatTimeAgo(log.timestamp)}</div>
                </div>
                <button class="rappeler-btn" onclick="event.stopPropagation(); window.startCallWithUser('${partner.id}','${log.call_type}')">معاودة</button>
            </div>`;
        }).join('');
    }
    window.startCallWithUser = function(userId, type) {
        let partner = allEmployees.find(e => e.id === userId);
        if (partner) openChat(userId, partner.name);
        setTimeout(() => { if (type === 'audio') window.startCall('audio'); else window.startCall('video'); }, 500);
    };

    function showNotif(msg, icon='🔔') { let b = document.getElementById('notification'); b.innerHTML = `${icon} ${msg}`; b.style.display = 'block'; setTimeout(() => b.style.display = 'none', 3000); }
    function playBeep() { try { let ctx = new (window.AudioContext || window.webkitAudioContext)(); let osc = ctx.createOscillator(), gain = ctx.createGain(); osc.connect(gain); gain.connect(ctx.destination); osc.type = 'sine'; osc.frequency.value = 880; gain.gain.value = 0.3; gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.4); osc.start(); osc.stop(ctx.currentTime + 0.35); ctx.resume(); } catch(e) {} }
    function formatDuration(sec) { let m = Math.floor(sec/60), s = sec%60; return m ? `${m}د ${s}ث` : `${s}ث`; }
    function formatTimeAgo(date) { let d = new Date(date), now = new Date(), diff = Math.floor((now - d) / 1000); if (diff < 60) return `منذ ${diff} ث`; if (diff < 3600) return `منذ ${Math.floor(diff/60)} د`; if (diff < 86400) return `منذ ${Math.floor(diff/3600)} س`; return d.toLocaleDateString('ar'); }
    function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' })[m]); }
    function saveSession(id) { localStorage.setItem('myschool_user', id); }
    function getSavedSession() { return localStorage.getItem('myschool_user'); }
    function clearSession() { localStorage.removeItem('myschool_user'); }
    function isDirector() { return currentUser?.id === DIRECTOR_ID; }
    function logout() { if (peerConnection) window.hangUp(); clearSession(); if (presenceChannel) supabase.removeChannel(presenceChannel); if (messagesChannel) supabase.removeChannel(messagesChannel); if (signalingChannel) supabase.removeChannel(signalingChannel); if (typingChannel) supabase.removeChannel(typingChannel); currentUser = null; document.getElementById('app').style.display = 'none'; document.getElementById('loginScreen').style.display = 'block'; renderLoginList(); }
    document.getElementById('logoutBtn').onclick = () => logout();

    function getAvatarLocal(id) { let av = JSON.parse(localStorage.getItem('avatars') || '{}'); return av[id] || null; }
    function setAvatarLocal(id, url) { let av = JSON.parse(localStorage.getItem('avatars') || '{}'); av[id] = url; localStorage.setItem('avatars', JSON.stringify(av)); }
    async function uploadAvatar(file) {
        let ext = file.name.split('.').pop();
        let fileName = `${currentUser.id}_${Date.now()}.${ext}`;
        let path = `avatars/${fileName}`;
        let { error } = await supabase.storage.from('avatars').upload(path, file);

    // مكالمات WebRTC
    window.startCall = async function(type) {
        if (!activeChat || activeChat.id === 'group') { showNotif('اختر محادثة خاصة أولاً', '⚠️'); return; }
        let state = presenceChannel?.presenceState() || {};
        let online = false;
        Object.values(state).forEach(p => { if (Array.isArray(p) && p.some(u => u.user_id === activeChat.id)) online = true; else if (p?.user_id === activeChat.id) online = true; });
        if (!online) { showNotif('المستخدم غير متصل حالياً', '📵'); return; }
        targetUser = allEmployees.find(e => e.id === activeChat.id);
        if (!targetUser) return;
        currentCallType = type; isCallActive = true; callStartTime = null;
        await setupCall(false);
    };
    async function setupCall(isAnswer) {
        try {
            let stream = await requestMediaPermissions(currentCallType === 'video');
            localStream = stream;
            document.getElementById('localVideo').srcObject = stream;
            document.getElementById('callOverlay').style.display = 'flex';
            document.getElementById('callPartnerName').innerText = targetUser.name;
            if (peerConnection) peerConnection.close();
            peerConnection = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443'], username: 'openrelayproject', credential: 'openrelayproject' }] });
            stream.getTracks().forEach(t => peerConnection.addTrack(t, stream));
            peerConnection.ontrack = e => { if (e.streams[0]) document.getElementById('remoteVideo').srcObject = e.streams[0]; document.getElementById('callStatus').innerHTML = '✅ متصل'; isCallActive = true; };
            peerConnection.onicecandidate = e => { if (e.candidate && signalingChannel) signalingChannel.send({ type: 'broadcast', event: 'ice', payload: { candidate: e.candidate, from: currentUser.id, target: targetUser.id } }); };
            if (isAnswer) {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
                let answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                signalingChannel.send({ type: 'broadcast', event: 'answer', payload: { sdp: peerConnection.localDescription, from: currentUser.id, target: targetUser.id } });
                callStartTime = Date.now();
                stopRingtone();
            } else {
                let offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                signalingChannel.send({ type: 'broadcast', event: 'offer', payload: { sdp: peerConnection.localDescription, from: currentUser.id, target: targetUser.id, type: currentCallType } });
                callStartTime = Date.now();
            }
        } catch (err) { console.error(err); showNotif('فشل الوصول للميكروفون/الكاميرا', '❌'); window.hangUp(); }
    }
    window.hangUp = function() {
        if (targetUser && signalingChannel && isCallActive) signalingChannel.send({ type: 'broadcast', event: 'end', payload: { from: currentUser.id, target: targetUser.id } });
        if (peerConnection) peerConnection.close();
        if (localStream) localStream.getTracks().forEach(t => t.stop());
        if (isCallActive && callStartTime && targetUser && currentUser) {
            let dur = Math.floor((Date.now() - callStartTime) / 1000);
            addCallLog(currentUser.id, targetUser.id, currentCallType, true, dur);
        } else if (!isCallActive && pendingFrom) {
            addCallLog(pendingFrom, currentUser.id, pendingType, false, 0);
        }
        document.getElementById('callOverlay').style.display = 'none';
        isCallActive = false; targetUser = null; pendingOffer = null; pendingFrom = null; pendingType = null; callStartTime = null;
        stopRingtone();
    };
    document.getElementById('hangupBtn').onclick = window.hangUp;

    async function handleTyping() {
        if (!activeChat || activeChat.id === 'group') return;
        let chatId = [currentUser.id, activeChat.id].sort().join('_');
        if (!isTyping) {
            isTyping = true;

        }
        if (typingTimeout) clearTimeout(typingTimeout);
        typingTimeout = setTimeout(async () => {
            isTyping = false;
            await typingChannel.send({ type: 'broadcast', event: 'typing_stop', payload: { chat_id: chatId, user_id: currentUser.id } });
        }, 1500);

    function startTypingListener() {
        if (!typingChannel) return;
        let currentChatId = activeChat.id === 'group' ? 'group' : [currentUser.id, activeChat.id].sort().join('_');
        typingChannel.on('broadcast', { event: 'typing_start' }, ({ payload }) => {
            if (payload.chat_id === currentChatId && payload.user_id !== currentUser.id) {
                document.getElementById('typingIndicator').innerHTML = `<div class="typing-dots"><span></span><span></span><span></span></div> ${payload.name} يكتب...`;
                document.getElementById('typingIndicator').style.display = 'block';
            }
        });
        typingChannel.on('broadcast', { event: 'typing_stop' }, ({ payload }) => {
            if (payload.chat_id === currentChatId && payload.user_id !== currentUser.id) {
                document.getElementById('typingIndicator').style.display = 'none';
            }
        });
    }

    async function initRealtimeChannels() {
        presenceChannel = supabase.channel('online-users', { config: { presence: { key: currentUser.id } } });
        presenceChannel.on('presence', { event: 'sync' }, () => loadStoriesAndChats()).on('presence', { event: 'join' }, () => loadStoriesAndChats()).on('presence', { event: 'leave' }, () => loadStoriesAndChats()).subscribe(async (s) => { if (s === 'SUBSCRIBED') await presenceChannel.track({ user_id: currentUser.id }); });
        messagesChannel = supabase.channel('messages-channel').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, async (payload) => { 
            if (activeChat) { 
                let cid = activeChat.id === 'group' ? 'group' : [currentUser.id, activeChat.id].sort().join('_'); 
                if (payload.new.chat_id === cid) await fetchMessages(); 
            } 
            await loadStoriesAndChats(); 
            if (payload.new.sender !== currentUser.id) { 
                playNotificationSound();
                showNotif('📩 رسالة جديدة من ' + (allEmployees.find(e => e.id === payload.new.sender)?.name || 'شخص'), '🔔'); 
            } 
        }).subscribe();
        signalingChannel = supabase.channel('signaling', { config: { broadcast: { ack: true } } });
        signalingChannel.on('broadcast', { event: 'offer' }, ({ payload }) => { if (payload.target === currentUser.id && !isCallActive) { pendingOffer = payload.sdp; pendingFrom = payload.from; pendingType = payload.type; let caller = allEmployees.find(e => e.id === payload.from); if (caller) showIncomingCall(caller.name, payload.type, payload.from); } });
        signalingChannel.on('broadcast', { event: 'answer' }, async ({ payload }) => { if (payload.target === currentUser.id && peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp)); });
        signalingChannel.on('broadcast', { event: 'ice' }, async ({ payload }) => { if (payload.target === currentUser.id && peerConnection && payload.candidate) await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate)); });
        signalingChannel.on('broadcast', { event: 'end' }, () => { if (isCallActive) window.hangUp(); document.getElementById('incomingCall').style.display = 'none'; stopRingtone(); });
        signalingChannel.subscribe();
        typingChannel = supabase.channel('typing', { config: { broadcast: { ack: true } } });
        typingChannel.subscribe();
    }

        if (!isDirector()) return alert('غير مصرح');
        if (id === DIRECTOR_ID) return alert('لا يمكن حذف المدير');
        if (!confirm(`حذف "${name}" نهائياً؟`)) return;
        allEmployees = allEmployees.filter(e => e.id !== id);
        let csv = "الرقم الوظيفي;اللقب والاسم;الوظيفة\n" + allEmployees.map(e => `${e.id};${e.name};${e.job}`).join('\n');
        let blob = new Blob(["\uFEFF" + csv], { type: "text/csv" });
        let a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'employees.csv'; a.click();
        renderLoginList(); await loadStoriesAndChats(); showNotif('تم الحذف', '🗑️'); renderDeleteEmployeeList();
    };

    document.querySelectorAll('.nav-item').forEach(item => {
        item.onclick = () => {
            let section = item.dataset.section;
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            item.classList.add('active');
            if (section === 'chats') { document.getElementById('mainView').style.display = 'flex'; document.getElementById('callsScreen').style.display = 'none'; document.getElementById('chatScreen').style.display = 'none'; loadStoriesAndChats(); }
            else if (section === 'calls') { document.getElementById('mainView').style.display = 'none'; document.getElementById('callsScreen').style.display = 'block'; renderCallsLog(); }
            else if (section === 'settings') toggleAdminPanel();
        };
    });
    document.getElementById('closeCallsBtn').onclick = () => { document.getElementById('callsScreen').style.display = 'none'; document.getElementById('mainView').style.display = 'flex'; document.querySelector('.nav-item[data-section="chats"]').click(); };
    loadEmployees();
})();
</script>
</body>
</html>
