<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Messenger Pro - المؤسسة</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --sky-bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #0084ff;
            --primary-light: #e7f3ff;
            --secondary: #050505;
            --text-dark: #1c1e21;
            --text-muted: #65676b;
            --bubble-sent: #0084ff;
            --bubble-received: #e4e6eb;
            --bubble-text-sent: #ffffff;
            --bubble-text-received: #050505;
            --online-dot: #31a24c;
            --shadow-sm: 0 2px 12px rgba(0,0,0,0.1);
            --border-light: #ced0d4;
            --badge-bg: #f02849;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background: var(--sky-bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

        .login-screen {
            background: var(--card-bg); border-radius: 20px; box-shadow: var(--shadow-sm);
            max-width: 420px; width: 90%; padding: 20px 20px 15px; text-align: center; margin: 20px auto;
        }
        .login-screen h1 { font-size: 28px; margin-bottom: 5px; }
        .login-screen p { margin-bottom: 8px; }
        .input-field { width: 100%; padding: 10px; border-radius: 20px; border: 1px solid var(--border-light); background: #f0f2f5; outline: none; margin: 6px 0; font-size: 14px; }
        .dropdown-list { max-height: 200px; overflow-y: auto; border: 1px solid var(--border-light); border-radius: 12px; background: white; text-align: right; display: none; }
        .dropdown-item { padding: 10px; cursor: pointer; display: flex; align-items: center; border-bottom: 1px solid #f0f0f0; transition: 0.2s; }
        .dropdown-item:hover { background: #f0f2f5; }
        .login-btn { width: 100%; padding: 12px; border-radius: 25px; border: none; background: var(--primary); color: white; font-weight: bold; cursor: pointer; margin: 6px 0; font-size: 15px; transition: 0.3s; }
        .login-btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .link-btn { background: none; border: none; color: var(--primary); cursor: pointer; margin-top: 6px; font-size: 14px; }

        #app { display: none; width: 100%; max-width: 500px; height: 100vh; background: white; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.1); overflow: hidden; }
        .main-header { padding: 12px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #ddd; flex-shrink: 0; background: white; }
        .main-header h2 { font-size: 20px; font-weight: bold; }
        .online-bar { display: flex; padding: 10px 8px; gap: 12px; overflow-x: auto; border-bottom: 1px solid #f0f0f0; flex-shrink: 0; background: white; }
        .online-user { display: flex; flex-direction: column; align-items: center; min-width: 65px; cursor: pointer; position: relative; }
        .story-avatar { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--primary); padding: 2px; object-fit: cover; transition: 0.2s; }
        .story-avatar:hover { transform: scale(1.05); }
        .active-dot { width: 12px; height: 12px; background: var(--online-dot); border: 2px solid white; border-radius: 50%; position: absolute; bottom: 15px; right: 5px; }
        .chats-list { flex: 1; overflow-y: auto; }
        .chat-row { display: flex; padding: 12px 12px; align-items: center; cursor: pointer; position: relative; transition: 0.2s; border-bottom: 1px solid #f5f5f5; }
        .chat-row:hover { background: #f5f5f5; }
        .chat-info { margin-right: 10px; flex: 1; }
        .chat-info h5 { font-size: 14px; margin-bottom: 2px; color: var(--secondary); }
        .chat-info p { font-size: 12px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .unread-badge { background: var(--badge-bg); color: white; border-radius: 50%; min-width: 18px; height: 18px; font-size: 10px; display: flex; align-items: center; justify-content: center; position: absolute; left: 15px; top: 50%; transform: translateY(-50%); font-weight: bold; }
        .chat-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 200; display: none; flex-direction: column; }
        .chat-header { padding: 10px; display: flex; align-items: center; border-bottom: 1px solid #ddd; flex-shrink: 0; background: white; }
        .chat-header img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
        .messages-container { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: #fff; }

        .message { max-width: 75%; position: relative; }
        .message.sent { align-self: flex-end; }
        .message.received { align-self: flex-start; }
        .bubble { padding: 8px 12px; border-radius: 18px; font-size: 13px; position: relative; word-wrap: break-word; }
        .sent .bubble { background: var(--bubble-sent); color: var(--bubble-text-sent); border-bottom-right-radius: 4px; }
        .received .bubble { background: var(--bubble-received); color: var(--bubble-text-received); border-bottom-left-radius: 4px; }
        .msg-time {
            font-size: 10px;
            margin-top: 3px;
            padding: 0 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
        }
        .sent .msg-time { color: rgba(255,255,255,0.9); flex-direction: row-reverse; }
        .received .msg-time { color: #65676b; }
        .delete-msg-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 11px;
            padding: 2px 5px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .sent .delete-msg-btn { color: rgba(255,255,255,0.7); }
        .received .delete-msg-btn { color: #999; }
        .delete-msg-btn:hover { background: rgba(0,0,0,0.1); }

        .input-area { padding: 10px; display: flex; align-items: center; gap: 8px; border-top: 1px solid #eee; flex-shrink: 0; background: white; }
        .input-wrapper { flex: 1; background: #f0f2f5; border-radius: 25px; padding: 6px 15px; }
        .input-wrapper input { width: 100%; border: none; background: transparent; outline: none; font-size: 14px; }
        .bottom-nav { display: flex; justify-content: space-around; padding: 10px; border-top: 1px solid #eee; background: white; flex-shrink: 0; }
        .nav-item { cursor: pointer; text-align: center; transition: 0.2s; padding: 4px 12px; border-radius: 20px; }
        .nav-item.active { color: var(--primary); background: var(--primary-light); }
        .nav-item:not(.active) { color: var(--text-muted); }
        .call-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #1c1e21; z-index: 1000; display: none; flex-direction: column; align-items: center; justify-content: center; color: white; }
        .notification { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--primary); color: white; padding: 10px 20px; border-radius: 30px; z-index: 10000; display: none; font-size: 13px; box-shadow: var(--shadow-sm); }
        .settings-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; border-radius: 20px; padding: 20px; z-index: 3000; display: none; width: 90%; max-width: 350px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .incoming-call { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: white; border-radius: 20px; padding: 15px; z-index: 2000; display: none; text-align: center; box-shadow: 0 8px 25px rgba(0,0,0,0.2); }
        .settings-modal .option-btn { display: block; width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ddd; background: white; border-radius: 12px; cursor: pointer; text-align: center; transition: 0.2s; }
        .settings-modal .option-btn:hover { background: #f5f5f5; }
    </style>
</head>
<body>
<div id="loginScreen" class="login-screen">
    <h1 style="color:var(--primary);">Messenger Pro</h1>
    <p style="color:var(--text-muted);">نظام تواصل المؤسسة الذكي</p>
    <div id="statusBar" style="font-size:11px; margin:6px 0; color: var(--text-muted);">⏳ جاري التحميل...</div>
    <div id="searchPhase">
        <input type="text" id="loginSearch" class="input-field" placeholder="🔍 اكتب أول حرفين من اسمك..." oninput="window.searchEmployees()" autocomplete="off">
        <div id="searchDropdown" class="dropdown-list"></div>
    </div>
    <div id="credentialsPhase" style="display:none;">
        <p id="selectedEmpName" style="font-weight:bold; font-size:15px; margin:5px 0;"></p>
        <input type="password" id="passInput" class="input-field" placeholder="الرقم الوظيفي">
        <button id="verifyIdBtn" class="login-btn">تحقق</button>
        <button class="link-btn" id="backToSearch1">⬅ العودة</button>
    </div>
    <div id="passwordPhase" style="display:none;">
        <p style="font-size:14px; margin:5px 0;">قم بإنشاء كلمة مرور جديدة</p>
        <input type="password" id="newPassword" class="input-field" placeholder="كلمة المرور الجديدة">
        <input type="password" id="confirmPassword" class="input-field" placeholder="تأكيد كلمة المرور">
        <label style="display:flex; align-items:center; gap:5px; margin:8px 0; cursor:pointer;"><input type="checkbox" id="rememberMeCheckbox"> تذكرني</label>
        <button id="setPasswordBtn" class="login-btn">دخول</button>
        <button class="link-btn" id="backToSearch2">⬅ العودة</button>
    </div>
    <div class="admin-panel" id="adminPanel" style="display:none; background:#fff; border:1px solid #e0e0e0; padding:15px; border-radius:20px; margin-top:15px; text-align:right;">
        <h4 style="color: #f57c00; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;"><i class="fas fa-user-shield"></i> إدارة شؤون الموظفين</h4>
        <input type="text" id="newEmpName" class="input-field" placeholder="اللقب والاسم">
        <input type="text" id="newEmpId" class="input-field" placeholder="الرقم الوظيفي">
        <input type="text" id="newEmpJob" class="input-field" placeholder="الوظيفة">
        <button onclick="window.addEmployee()" class="login-btn" style="background:#2e7d32;">إضافة موظف جديد</button>
        <div id="empDeleteList" style="margin-top:12px; max-height:130px; overflow-y:auto; border-top:1px solid #eee; padding-top:8px;"></div>
        <button onclick="window.toggleAdminPanel()" class="login-btn" style="background:#d32f2f;">إغلاق اللوحة</button>
    </div>
</div>

<div id="app">
    <div id="mainView" style="display:flex; flex-direction:column; height:100%;">
        <div class="main-header">
            <h2>المحادثات</h2>
            <div style="display:flex; gap:15px;">
                <i class="fas fa-cog" id="adminIcon" style="cursor:pointer;"></i>
                <i class="fas fa-power-off" id="logoutBtn" style="color:#f44336; cursor:pointer;"></i>
            </div>
        </div>
        <div class="online-bar" id="storiesContainer"></div>
        <div class="chats-list" id="chatsList"></div>
        <div class="bottom-nav">
            <div class="nav-item active" data-section="chats"><i class="fas fa-comment-dots"></i><div>الدردشات</div></div>
            <div class="nav-item" data-section="calls"><i class="fas fa-phone-alt"></i><div>المكالمات</div></div>
        </div>
    </div>
    <div id="callsScreen" style="display:none; height:100%; overflow-y:auto;">
        <div style="display:flex; align-items:center; gap:15px; padding:15px;"><i class="fas fa-arrow-right" id="closeCallsBtn" style="cursor:pointer;"></i> <h3>سجل المكالمات</h3></div>
        <div id="callsList" style="padding:10px;"></div>
    </div>
    <div id="chatScreen" class="chat-screen">
        <div class="chat-header">
            <i class="fas fa-arrow-right" id="closeChatBtn" style="margin-left:10px; cursor:pointer; font-size:20px;"></i>
            <img id="chatHeaderImg">
            <div style="flex:1; margin-right:10px;"><strong id="chatHeaderName"></strong><div id="typingIndicator" style="font-size:11px;color:var(--online-dot);display:none;">يكتب الآن...</div></div>
            <i class="fas fa-phone-alt" id="callAudioBtn" style="margin-left:15px; cursor:pointer; font-size:18px; color: var(--primary);"></i>
            <i class="fas fa-video" id="callVideoBtn" style="cursor:pointer; font-size:18px; color: var(--primary);"></i>
            <!-- زر حذف جميع الرسائل يظهر للمدير فقط -->
            <i class="fas fa-trash-alt" id="deleteAllBtn" style="margin-left:15px; cursor:pointer; font-size:18px; color: #d32f2f; display:none;" title="حذف جميع الرسائل"></i>
        </div>
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-area">
            <i class="fas fa-plus-circle" id="pickImageBtn" style="color: var(--primary); font-size: 22px; cursor:pointer;"></i>
            <div class="input-wrapper"><input type="text" id="msgInput" placeholder="اكتب رسالة..."></div>
            <i class="fas fa-paper-plane" id="sendBtn" style="color:var(--primary); font-size:22px; cursor:pointer;"></i>
        </div>
    </div>
</div>

<div id="callOverlay" class="call-overlay">
    <div id="callPartnerName" style="font-size:24px;"></div>
    <div id="callStatus" style="margin:10px 0;">جاري الاتصال...</div>
    <video id="remoteVideo" style="width:300px; background:#000; border-radius:20px;" autoplay playsinline></video>
    <video id="localVideo" style="position:absolute; bottom:50px; right:50px; width:100px; border-radius:10px; border:2px solid white;" autoplay playsinline muted></video>
    <div style="margin-top:30px; display:flex; gap:20px;">
        <button id="micBtn" style="background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:55px; height:55px; color:white; font-size:20px;"><i class="fas fa-microphone"></i></button>
        <button id="hangupBtn" style="background:#f44336; border:none; border-radius:50%; width:65px; height:65px; color:white; font-size:24px;"><i class="fas fa-phone-slash"></i></button>
        <button id="camBtn" style="background:rgba(255,255,255,0.2); border:none; border-radius:50%; width:55px; height:55px; color:white; font-size:20px;"><i class="fas fa-video"></i></button>
    </div>
</div>

<div id="incomingCall" class="incoming-call"></div>
<div id="notification" class="notification"></div>
<div id="settingsModal" class="settings-modal">
    <h3 style="text-align:center; margin-bottom:20px;">الإعدادات</h3>
    <button class="option-btn" onclick="promptChangeAvatar()"><i class="fas fa-camera"></i> تغيير الصورة الشخصية</button>
    <button class="option-btn" id="adminPanelBtn" style="display:none;" onclick="document.getElementById('settingsModal').style.display='none'; toggleAdminPanel();"><i class="fas fa-users-cog"></i> إدارة الموظفين</button>
    <button class="option-btn" style="color:#d32f2f;" onclick="document.getElementById('settingsModal').style.display='none'; clearRememberedUser(); logout();"><i class="fas fa-sign-out-alt"></i> تسجيل الخروج</button>
    <button class="option-btn" onclick="document.getElementById('settingsModal').style.display='none';">إغلاق</button>
</div>

<input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="window.changeAvatar(event)">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ======================= الإعدادات والمتغيرات =======================
const SUPABASE_URL = 'https://nfywbkvsvmhaczfatxkp.supabase.co';
const SUPABASE_KEY = 'sb_publishable_VZMRpated19TvFgjTuf1Lw_uW7dOiHY';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const DIRECTOR_ID = '1098107010228600';

let allEmployees = [];
let currentUser = null;
let activeChat = null;
let currentChatId = null; // لتخزين معرف المحادثة الحالي
let unreadCounts = JSON.parse(localStorage.getItem('unread_counts') || '{}');
let messagesChannel = null, typingChannel = null, presenceChannel = null, signalingChannel = null;
let onlineUsers = new Set();
let localStream = null, peerConnection = null;
let isCallActive = false, currentCallType = null, targetUser = null;
let pendingOffer = null, pendingFrom = null, pendingType = null, callStartTime = null;

// ======================= نظام تذكرني =======================
function getRememberedUser() { const d = localStorage.getItem('remembered_user'); return d ? JSON.parse(d) : null; }
function setRememberedUser(userId, password) { localStorage.setItem('remembered_user', JSON.stringify({userId, password, timestamp: Date.now()})); }
function clearRememberedUser() { localStorage.removeItem('remembered_user'); }

// ======================= الصوت (مسنجر) =======================
function playTone(type) {
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    gain.gain.value = 0.15;
    if (type === 'message') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(800, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime+0.15);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.2);
        osc.start(); osc.stop(ctx.currentTime+0.2);
    } else if (type === 'call') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(600, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime+0.6);
        gain.gain.setValueAtTime(0.15, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.8);
        osc.start(); osc.stop(ctx.currentTime+0.8);
    }
    ctx.resume();
    if (navigator.vibrate) navigator.vibrate(type==='call' ? [500,300,500] : 200);
}

// ======================= دوال مساعدة =======================
function showNotif(msg, icon='🔔') { const n=document.getElementById('notification'); n.innerHTML=icon+' '+msg; n.style.display='block'; setTimeout(()=>n.style.display='none',3000); }
function scrollToBottom() { const c=document.getElementById('messagesContainer'); if(c) c.scrollTo({top:c.scrollHeight,behavior:'smooth'}); }
function formatTime(d) {
    const date = new Date(d);
    const h = String(date.getHours()).padStart(2,'0');
    const m = String(date.getMinutes()).padStart(2,'0');
    const s = String(date.getSeconds()).padStart(2,'0');
    return `${h}:${m}:${s}`;
}
function formatTimeAgo(d) { const diff=Math.floor((new Date()-new Date(d))/1000); if(diff<60) return `منذ ${diff} ث`; if(diff<3600) return `منذ ${Math.floor(diff/60)} د`; if(diff<86400) return `منذ ${Math.floor(diff/3600)} س`; return new Date(d).toLocaleDateString('ar'); }
function escapeHtml(s) { return s.replace(/[&<>]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }
function isDirector() { return currentUser?.id === DIRECTOR_ID; }
function getActiveChatsKey() { return `active_chats_${currentUser.id}`; }
function getActiveChats() { const s=localStorage.getItem(getActiveChatsKey()); return s?JSON.parse(s):[]; }
function saveActiveChats(chats) { localStorage.setItem(getActiveChatsKey(), JSON.stringify(chats)); }
function addToActiveChats(chatId) { const chats=getActiveChats(); if(!chats.includes(chatId)) { chats.push(chatId); saveActiveChats(chats); } }
function incrementUnread(chatId, senderId) {
    if (activeChat && ((activeChat.id==='group' && chatId==='group') || (activeChat.id!=='group' && chatId===[currentUser.id, activeChat.id].sort().join('_'))) && senderId!==currentUser.id) return;
    if (senderId===currentUser.id) return;
    unreadCounts[chatId] = (unreadCounts[chatId]||0)+1;
    localStorage.setItem('unread_counts', JSON.stringify(unreadCounts));
    if (document.getElementById('mainView').style.display !== 'none') renderChatsList();
}
function markChatAsRead(chatId) { if(unreadCounts[chatId]) { delete unreadCounts[chatId]; localStorage.setItem('unread_counts', JSON.stringify(unreadCounts)); renderChatsList(); } }

// ======================= الصور الشخصية =======================
function getAvatarUrl(empId) {
    if (empId === 'group') return 'https://ui-avatars.com/api/?name=Group&background=0084ff&color=fff&size=100';
    const saved = localStorage.getItem(`avatar_${empId}`);
    if (saved) return saved;
    const emp = allEmployees.find(e=>e.id===empId) || currentUser;
    if (emp) return `https://ui-avatars.com/api/?name=${encodeURIComponent(emp.name)}&background=2c2c2e&color=fff&size=100`;
    return 'https://ui-avatars.com/api/?name=User&background=2c2c2e&color=fff&size=100';
}
function promptChangeAvatar() {
    if (!currentUser) return;
    document.getElementById('avatarFileInput').click();
}
window.changeAvatar = function(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { alert('حجم الصورة كبير جداً، اختر صورة أقل من 5MB'); return; }
    const reader = new FileReader();
    reader.onload = async function(e) {
        const base64 = e.target.result;
        localStorage.setItem(`avatar_${currentUser.id}`, base64);
        try {
            const blob = await fetch(base64).then(r => r.blob());
            const fileName = `avatar_${currentUser.id}_${Date.now()}.jpg`;
            const { error: uploadError } = await supabaseClient.storage
                .from('avatars')
                .upload(fileName, blob, { cacheControl: '3600', upsert: true });
            if (!uploadError) {
                const { data: urlData } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
                try {
                    await supabaseClient.from('profiles').upsert({ 
                        id: currentUser.id, 
                        name: currentUser.name, 
                        job: currentUser.job,
                        avatar_url: urlData.publicUrl 
                    }, { onConflict: 'id' });
                } catch(profileError) {}
            }
        } catch(storageError) {}
        renderStories(); renderChatsList();
        if (activeChat) document.getElementById('chatHeaderImg').src = base64;
        showNotif('تم تغيير الصورة بنجاح', '🖼️');
    };
    reader.readAsDataURL(file);
};

// ======================= حذف الرسائل (فردية) =======================
async function deleteMessage(msgId) {
    if (!confirm('هل أنت متأكد من حذف هذه الرسالة؟')) return;
    const { error } = await supabaseClient.from('messages').delete().eq('id', msgId);
    if (!error) {
        const msgElement = document.querySelector(`[data-msg-id="${msgId}"]`);
        if (msgElement) msgElement.remove();
        showNotif('تم حذف الرسالة', '🗑️');
    }
}

// ======================= حذف جميع رسائل المحادثة الحالية (للمدير) =======================
async function deleteAllMessages() {
    if (!isDirector()) {
        showNotif('غير مصرح لك بهذه العملية', '⛔');
        return;
    }
    if (!currentChatId) {
        showNotif('لا توجد محادثة مفتوحة', '❓');
        return;
    }

    if (!confirm('هل أنت متأكد من حذف جميع رسائل هذه المحادثة؟ لا يمكن التراجع عن ذلك.')) return;

    const { error } = await supabaseClient
        .from('messages')
        .delete()
        .eq('chat_id', currentChatId);

    if (error) {
        showNotif('فشل في حذف الرسائل: ' + error.message, '❌');
        return;
    }

    // تفريغ شاشة المحادثة
    document.getElementById('messagesContainer').innerHTML = 
        '<div style="text-align:center;margin-top:50px;color:gray;">تم حذف جميع الرسائل 🗑️</div>';

    // إزالة إشعارات غير المقروءة لهذه المحادثة
    if (unreadCounts[currentChatId]) {
        delete unreadCounts[currentChatId];
        localStorage.setItem('unread_counts', JSON.stringify(unreadCounts));
    }

    renderChatsList();
    showNotif('تم حذف جميع الرسائل بنجاح', '✅');
}

// ======================= تحميل الموظفين =======================
async function loadEmployees() {
    try {
        const r = await fetch('./employees.csv');
        const text = await r.text();
        const lines = text.replace(/^\uFEFF/,'').split('\n').filter(l=>l.trim() && !l.startsWith('الرقم'));
        allEmployees = lines.map(line=>{ const p=line.split(';'); return {id:p[0]?.trim(),name:p[1]?.trim(),job:p[2]?.trim()}; });
        document.getElementById('statusBar').innerText = `✅ ${allEmployees.length} موظف`;
        try {
            const { data: supData } = await supabaseClient.from('profiles').select('*');
            if (supData) {
                for (const supEmp of supData) {
                    const idx = allEmployees.findIndex(e=>e.id===supEmp.id);
                    if (idx>=0) {
                        if (supEmp.avatar_url) localStorage.setItem(`avatar_${supEmp.id}`, supEmp.avatar_url);
                    } else {
                        allEmployees.push(supEmp);
                    }
                }
            }
        } catch(e) {}
        checkAutoLogin();
    } catch(e) { document.getElementById('statusBar').innerText='❌ فشل تحميل البيانات'; }
}

// ======================= القنوات =======================
async function initChannels() {
    messagesChannel = supabaseClient.channel('messages-channel')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'}, async payload=>{
        const msg = payload.new;
        if(activeChat) {
            const cid = activeChat.id==='group'?'group':[currentUser.id, activeChat.id].sort().join('_');
            if(msg.chat_id===cid) {
                await fetchMessages(cid);
            } else if(msg.sender!==currentUser.id) {
                incrementUnread(msg.chat_id, msg.sender);
            }
        } else if(msg.sender!==currentUser.id) {
            incrementUnread(msg.chat_id, msg.sender);
        }
        renderChatsList();
        if(msg.sender!==currentUser.id) { 
            playTone('message'); 
            const s=allEmployees.find(e=>e.id===msg.sender); 
            showNotif(`📩 رسالة جديدة من ${s?.name||'شخص'}`);
        }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'messages'}, payload=>{
        const deletedId = payload.old.id;
        const msgElement = document.querySelector(`[data-msg-id="${deletedId}"]`);
        if (msgElement) msgElement.remove();
    })
    .subscribe();
    
    typingChannel = supabaseClient.channel('typing',{config:{broadcast:{ack:true}}});
    typingChannel.on('broadcast',{event:'typing_start'},({payload})=>{
        if(activeChat && payload.chat_id===activeChat.id && payload.user_id!==currentUser.id) { document.getElementById('typingIndicator').style.display='block'; document.getElementById('typingIndicator').innerText=payload.name+' يكتب...'; }
    }).on('broadcast',{event:'typing_stop'},()=>{ document.getElementById('typingIndicator').style.display='none'; }).subscribe();
}
function initPresence() {
    if(presenceChannel) supabaseClient.removeChannel(presenceChannel);
    presenceChannel = supabaseClient.channel('online-users',{config:{presence:{key:currentUser.id}}});
    presenceChannel.on('presence',{event:'sync'},()=>{
        const state = presenceChannel.presenceState(); onlineUsers.clear();
        for(const key in state) if(key!==currentUser.id) onlineUsers.add(key);
        renderStories();
    }).subscribe(async status=>{ if(status==='SUBSCRIBED') await presenceChannel.track({user_id:currentUser.id, name:currentUser.name}); });
}
function initSignaling() {
    if(signalingChannel) supabaseClient.removeChannel(signalingChannel);
    signalingChannel = supabaseClient.channel('signaling');
    signalingChannel.on('broadcast',{event:'offer'},async({payload})=>{
        if(payload.target===currentUser.id && !isCallActive) {
            pendingOffer=payload.sdp; pendingFrom=payload.from; pendingType=payload.type;
            const caller = allEmployees.find(e=>e.id===payload.from);
            if(caller) { playTone('call'); showIncomingCall(caller.name, payload.type, payload.from); }
        }
    }).on('broadcast',{event:'answer'},async({payload})=>{
        if(payload.target===currentUser.id && peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(payload.sdp));
    }).on('broadcast',{event:'ice'},async({payload})=>{
        if(payload.target===currentUser.id && peerConnection && payload.candidate) await peerConnection.addIceCandidate(new RTCIceCandidate(payload.candidate));
    }).on('broadcast',{event:'end'},()=>{ if(isCallActive) hangUp(false); document.getElementById('incomingCall').style.display='none'; }).subscribe();
}

async function renderChatsList() {
    const container = document.getElementById('chatsList');
    const activeList = getActiveChats();
    const groupUnread = unreadCounts['group']||0;
    let lastGroupMsg = '';
    try { const { data } = await supabaseClient.from('messages').select('text').eq('chat_id','group').order('created_at',{ascending:false}).limit(1); if(data?.length) lastGroupMsg = data[0].text.replace(/<[^>]*>/g,'').substring(0,40); } catch(e){}
    let html = `<div class="chat-row" onclick="openChat('group','المجموعة العامة')">
        <div style="position:relative"><img src="${getAvatarUrl('group')}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">${groupUnread>0?`<div class="unread-badge">${groupUnread}</div>`:''}</div>
        <div class="chat-info"><h5>المجموعة العامة 📢</h5><p>${lastGroupMsg?escapeHtml(lastGroupMsg):'تواصل مع جميع الموظفين'}</p></div>
    </div>`;
    for (const chatId of activeList) {
        if(chatId==='group') continue;
        const ids = chatId.split('_'); const other = ids.find(id=>id!==currentUser.id); if(!other) continue;
        const emp = allEmployees.find(e=>e.id===other); if(!emp) continue;
        const count = unreadCounts[chatId]||0; let lastMsg='',lastTime='';
        try { const { data:last } = await supabaseClient.from('messages').select('text,created_at').eq('chat_id',chatId).order('created_at',{ascending:false}).limit(1); if(last?.length) { lastMsg=last[0].text.replace(/<[^>]*>/g,'').substring(0,40); lastTime=formatTimeAgo(last[0].created_at); } } catch(e){}
        html += `<div class="chat-row" onclick="openChat('${emp.id}','${emp.name}')">
            <div style="position:relative"><img src="${getAvatarUrl(emp.id)}" style="width:50px;height:50px;border-radius:50%;object-fit:cover;">${count>0?`<div class="unread-badge">${count}</div>`:''}</div>
            <div class="chat-info"><h5>${emp.name}</h5><p>${lastMsg?escapeHtml(lastMsg):'ابدأ المحادثة'}</p></div>
            <div style="font-size:10px;color:gray;">${lastTime}</div>
        </div>`;
    }
    container.innerHTML = html || '<div style="text-align:center;padding:40px;color:gray;">لا توجد محادثات بعد</div>';
}

async function fetchMessages(chatId) {
    const { data } = await supabaseClient.from('messages').select('*').eq('chat_id', chatId).order('created_at', { ascending: true });
    const c = document.getElementById('messagesContainer');
    if (!data?.length) { c.innerHTML = '<div style="text-align:center;margin-top:50px;color:gray;">لا توجد رسائل</div>'; return; }
    c.innerHTML = data.map(m => {
        const isMine = m.sender === currentUser.id;
        const timeStr = formatTime(m.created_at);
        let senderName = '';
        if(activeChat.id==='group' && !isMine) { const s = allEmployees.find(e=>e.id===m.sender); if(s) senderName = `<div style="font-size:11px;color:var(--primary);margin-bottom:3px;font-weight:bold;">${s.name}</div>`; }
        const canDelete = isMine || isDirector();
        const deleteBtn = canDelete ? `<button class="delete-msg-btn" onclick="deleteMessage('${m.id}')" title="حذف"><i class="fas fa-trash-alt"></i></button>` : '';
        return `<div class="message ${isMine?'sent':'received'}" data-msg-id="${m.id}">
            ${senderName}
            <div class="bubble">${m.text}</div>
            <div class="msg-time"><span>${timeStr}</span>${deleteBtn}</div>
        </div>`;
    }).join('');
    scrollToBottom();
}
async function sendMessage() {
    const input = document.getElementById('msgInput');
    const text = input.value.trim();
    if(!text || !activeChat) return;
    const chatId = activeChat.id==='group'?'group':[currentUser.id, activeChat.id].sort().join('_');
    addToActiveChats(chatId);
    const { error } = await supabaseClient.from('messages').insert({ chat_id: chatId, sender: currentUser.id, text, created_at: new Date().toISOString() });
    if (!error) {
        input.value = '';
        await fetchMessages(chatId);
        renderChatsList();
    }
}
document.getElementById('sendBtn').onclick = sendMessage;
document.getElementById('msgInput').onkeydown = (e) => {
    if(e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    if(activeChat && activeChat.id!=='group' && typingChannel) {
        typingChannel.send({ type:'broadcast', event:'typing_start', payload:{ chat_id:activeChat.id, user_id:currentUser.id, name:currentUser.name } });
        if(window.typingTimeout) clearTimeout(window.typingTimeout);
        window.typingTimeout = setTimeout(()=>{ typingChannel.send({ type:'broadcast', event:'typing_stop', payload:{ chat_id:activeChat.id, user_id:currentUser.id } }); }, 2000);
    }
};

window.startCall = async function(type) {
    if(!activeChat || activeChat.id==='group') { showNotif('اختر محادثة خاصة أولاً','⚠️'); return; }
    targetUser = allEmployees.find(e=>e.id===activeChat.id); if(!targetUser) return;
    currentCallType = type; isCallActive = true; callStartTime = null;
    await setupCall(false);
};
async function setupCall(isAnswer) {
    try {
        const constraints = { audio: { echoCancellation:true, noiseSuppression:true }, video: currentCallType==='video' ? { width:{ideal:640}, height:{ideal:480} } : false };
        localStream = await navigator.mediaDevices.getUserMedia(constraints);
        document.getElementById('localVideo').srcObject = localStream;
        document.getElementById('callOverlay').style.display = 'flex';
        document.getElementById('callPartnerName').innerText = targetUser.name;
        if(peerConnection) peerConnection.close();
        peerConnection = new RTCPeerConnection({ iceServers:[{ urls:'stun:stun.l.google.com:19302' }] });
        localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));
        peerConnection.ontrack = e => { if(e.streams[0]) document.getElementById('remoteVideo').srcObject = e.streams[0]; document.getElementById('callStatus').innerHTML = '✅ متصل'; };
        peerConnection.onicecandidate = e => { if(e.candidate) signalingChannel.send({ type:'broadcast', event:'ice', payload:{ candidate:e.candidate, target:targetUser.id } }); };
        if(isAnswer) {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(pendingOffer));
            const answer = await peerConnection.createAnswer(); await peerConnection.setLocalDescription(answer);
            signalingChannel.send({ type:'broadcast', event:'answer', payload:{ sdp:peerConnection.localDescription, from:currentUser.id, target:targetUser.id } });
            callStartTime = Date.now();
        } else {
            const offer = await peerConnection.createOffer(); await peerConnection.setLocalDescription(offer);
            signalingChannel.send({ type:'broadcast', event:'offer', payload:{ sdp:peerConnection.localDescription, from:currentUser.id, target:targetUser.id, type:currentCallType } });
            playTone('call'); callStartTime = Date.now();
        }
    } catch(err) { console.error(err); showNotif('فشل الوصول للميكروفون/الكاميرا','❌'); hangUp(true); }
}
window.hangUp = function(sendSignal = true) {
    if(peerConnection) peerConnection.close();
    if(localStream) localStream.getTracks().forEach(t=>t.stop());
    if(isCallActive && callStartTime && targetUser && currentUser) addCallLog(currentUser.id, targetUser.id, currentCallType, true, Math.floor((Date.now()-callStartTime)/1000));
    else if(!isCallActive && pendingFrom) addCallLog(pendingFrom, currentUser.id, pendingType, false, 0);
    if(sendSignal && isCallActive && targetUser) signalingChannel.send({ type:'broadcast', event:'end', payload:{ target:targetUser.id } });
    document.getElementById('callOverlay').style.display = 'none';
    isCallActive = false; targetUser = null; pendingOffer = null; pendingFrom = null; pendingType = null; callStartTime = null;
};
document.getElementById('hangupBtn').onclick = ()=> hangUp(true);
document.getElementById('micBtn').onclick = ()=>{
    if(localStream){ const t=localStream.getAudioTracks()[0]; if(t){ t.enabled=!t.enabled; document.getElementById('micBtn').innerHTML = t.enabled?'<i class="fas fa-microphone"></i>':'<i class="fas fa-microphone-slash"></i>'; } }
};
document.getElementById('camBtn').onclick = ()=>{
    if(localStream){ const t=localStream.getVideoTracks()[0]; if(t){ t.enabled=!t.enabled; document.getElementById('camBtn').innerHTML = t.enabled?'<i class="fas fa-video"></i>':'<i class="fas fa-video-slash"></i>'; } }
};
function showIncomingCall(name, type, fromId) {
    const div = document.getElementById('incomingCall');
    div.innerHTML = `<div style="padding:20px;"><h3 style="margin-bottom:10px;"><i class="fas fa-phone-alt"></i> مكالمة واردة</h3><p style="font-size:15px; margin-bottom:15px;"><strong>${name}</strong> يطلب مكالمة ${type==='video'?'فيديو 📹':'صوتية 🎙️'}</p><div style="display:flex;gap:15px;justify-content:center;"><button id="acceptCallBtn" style="padding:12px 25px;background:#10b981;color:white;border:none;border-radius:30px;cursor:pointer;font-size:15px;"><i class="fas fa-check"></i> قبول</button><button id="rejectCallBtn" style="padding:12px 25px;background:#f44336;color:white;border:none;border-radius:30px;cursor:pointer;font-size:15px;"><i class="fas fa-times"></i> رفض</button></div></div>`;
    div.style.display = 'block';
    document.getElementById('acceptCallBtn').onclick = async ()=>{ div.style.display='none'; targetUser = allEmployees.find(e=>e.id===fromId); currentCallType=type; isCallActive=true; await setupCall(true); };
    document.getElementById('rejectCallBtn').onclick = ()=>{ div.style.display='none'; addCallLog(fromId, currentUser.id, type, false, 0); signalingChannel.send({ type:'broadcast', event:'end', payload:{ target:fromId } }); };
    setTimeout(()=>{ if(div.style.display==='block') { div.style.display='none'; addCallLog(fromId, currentUser.id, type, false, 0); signalingChannel.send({ type:'broadcast', event:'end', payload:{ target:fromId } }); } }, 30000);
}

document.getElementById('callVideoBtn').onclick = ()=> startCall('video');

// ======================= سجل المكالمات =======================
function addCallLog(callerId, calleeId, callType, answered, durationSec) {
    if(!currentUser) return;
    const entry = { id: Date.now()+'_'+Math.random().toString(36).substr(2,6), caller_id:callerId, callee_id:calleeId, call_type:callType, answered, missed:!answered, duration_seconds:durationSec||0, timestamp: new Date().toISOString() };
    const logs = JSON.parse(localStorage.getItem(`call_logs_${callerId}`)||'[]'); logs.unshift(entry); localStorage.setItem(`call_logs_${callerId}`, JSON.stringify(logs));
    if(callerId!==calleeId) { const l2 = JSON.parse(localStorage.getItem(`call_logs_${calleeId}`)||'[]'); l2.unshift(entry); localStorage.setItem(`call_logs_${calleeId}`, JSON.stringify(l2)); }
    if(document.getElementById('callsScreen').style.display==='block') renderCallsLog();
}
function formatDuration(sec) { const m=Math.floor(sec/60), s=sec%60; return m?`${m}د ${s}ث`:`${s}ث`; }
async function renderCallsLog() {
    if(!currentUser) return;
    const logs = JSON.parse(localStorage.getItem(`call_logs_${currentUser.id}`)||'[]');
    const c = document.getElementById('callsList');
    if(!logs.length) { c.innerHTML='<div style="text-align:center;padding:40px;color:gray;">لا توجد مكالمات</div>'; return; }
    c.innerHTML = logs.map(log=>{
        const pid = log.caller_id===currentUser.id ? log.callee_id : log.caller_id;
        const partner = allEmployees.find(e=>e.id===pid); if(!partner) return '';
        const ic = log.call_type==='video'?'<i class="fas fa-video"></i>':'<i class="fas fa-phone-alt"></i>';
        return `<div style="display:flex;align-items:center;padding:12px;background:white;border-radius:16px;margin-bottom:8px;cursor:pointer;" onclick="window.openChat('${partner.id}','${partner.name}')">
            <div style="width:45px;text-align:center;font-size:18px;${log.missed?'color:#f44336;':''}">${ic}</div>
            <div style="flex:1;margin-right:10px;"><div style="font-weight:bold;">${partner.name}</div><div style="font-size:12px;color:gray;">${log.missed?'فائتة • ':''}${log.duration_seconds?formatDuration(log.duration_seconds)+' • ':''}${formatTimeAgo(log.timestamp)}</div></div>
            <button onclick="event.stopPropagation();window.startCallWithUser('${partner.id}','${log.call_type}')" style="background:none;border:1px solid var(--primary);border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--primary);">معاودة</button>
        </div>`;
    }).join('');
}
window.startCallWithUser = function(userId, type) {
    const p = allEmployees.find(e=>e.id===userId);
    if(p) openChat(userId, p.name);
    setTimeout(()=>{ if(type==='audio') startCall('audio'); else startCall('video'); }, 500);
};

function logout() {
    if(messagesChannel) supabaseClient.removeChannel(messagesChannel);
    if(typingChannel) supabaseClient.removeChannel(typingChannel);
    if(presenceChannel) supabaseClient.removeChannel(presenceChannel);
    if(signalingChannel) supabaseClient.removeChannel(signalingChannel);
    currentUser = null; onlineUsers.clear();
    document.getElementById('app').style.display='none';
    document.getElementById('loginScreen').style.display='block';
    document.getElementById('searchPhase').style.display='block';
    document.getElementById('credentialsPhase').style.display='none';
    document.getElementById('passwordPhase').style.display='none';
    document.getElementById('loginSearch').value='';
    document.getElementById('settingsModal').style.display='none';
    document.getElementById('adminPanel').style.display='none';
}
window.toggleAdminPanel = ()=>{
    if (!isDirector()) return alert('غير مصرح');
    const p=document.getElementById('adminPanel');
    p.style.display = p.style.display==='block'?'none':'block';
    if(p.style.display==='block') renderDeleteEmployeeList();
};
function renderDeleteEmployeeList() {
    if(!isDirector()) return;
    const container = document.getElementById('empDeleteList');
    container.innerHTML = '<div style="font-size:13px; margin-bottom:8px; color:#666;">🗑️ حذف موظف:</div>' + 
        allEmployees.map(e=>`<div style="display:flex;justify-content:space-between;align-items:center;background:#f8f9fa;margin:6px 0;padding:8px 12px;border-radius:20px;">
            <span style="font-size:14px;">${e.name} <small style="color:gray;">(${e.job})</small></span>
            <button onclick="window.deleteEmployee('${e.id}','${e.name}')" style="background:#ff4444;border:none;color:white;border-radius:15px;padding:4px 12px;cursor:pointer;font-size:12px;">حذف</button>
        </div>`).join('');
}
window.addEmployee = async ()=>{
    if(!isDirector()) return alert('غير مصرح');
    const name=document.getElementById('newEmpName').value.trim();
    const id=document.getElementById('newEmpId').value.trim();
    const job=document.getElementById('newEmpJob').value.trim();
    if(!name||!id||!job) return alert('املأ جميع الحقول');
    if(allEmployees.find(e=>e.id===id)) return alert('الرقم الوظيفي موجود مسبقاً');
    allEmployees.push({id, name, job});
    let csv = "الرقم الوظيفي;اللقب والاسم;الوظيفة\n"+allEmployees.map(e=>`${e.id};${e.name};${e.job}`).join('\n');
    const blob = new Blob(["\uFEFF"+csv],{type:"text/csv"});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='employees.csv'; a.click();
    renderLoginList(); renderChatsList(); renderDeleteEmployeeList();
    showNotif('تمت إضافة الموظف بنجاح (سيتم تنزيل ملف CSV محدث)', '✅');
    document.getElementById('newEmpName').value='';
    document.getElementById('newEmpId').value='';
    document.getElementById('newEmpJob').value='';
};
window.deleteEmployee = async (id, name)=>{
    if(!isDirector()) return alert('غير مصرح');
    if(id===DIRECTOR_ID) return alert('لا يمكن حذف المدير');
    if(!confirm(`هل أنت متأكد من حذف "${name}" نهائياً؟`)) return;
    allEmployees = allEmployees.filter(e=>e.id!==id);
    let csv = "الرقم الوظيفي;اللقب والاسم;الوظيفة\n"+allEmployees.map(e=>`${e.id};${e.name};${e.job}`).join('\n');
    const blob = new Blob(["\uFEFF"+csv],{type:"text/csv"});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='employees.csv'; a.click();
    renderLoginList(); renderChatsList(); renderDeleteEmployeeList();
    showNotif('تم حذف الموظف (سيتم تنزيل ملف CSV محدث)', '🗑️');
};
function renderLoginList() {
    if (document.getElementById('searchPhase').style.display !== 'none') {
        window.searchEmployees();
    }
}

// ======================= التنقل =======================
document.querySelectorAll('.nav-item').forEach(item=>{
    item.onclick = ()=>{
        document.querySelectorAll('.nav-item').forEach(n=>{ n.classList.remove('active'); n.style.color='var(--text-muted)'; });
        item.classList.add('active'); item.style.color='var(--primary)';
        if(item.dataset.section==='chats') { 
            document.getElementById('mainView').style.display='flex'; 
            document.getElementById('callsScreen').style.display='none'; 
            document.getElementById('chatScreen').style.display='none'; 
            renderChatsList(); 
        } else { 
            document.getElementById('mainView').style.display='none'; 
            document.getElementById('callsScreen').style.display='block'; 
            renderCallsLog(); 
        }
    };
});
document.getElementById('closeCallsBtn').onclick = ()=>{ 
    document.getElementById('callsScreen').style.display='none'; 
    document.getElementById('mainView').style.display='flex'; 
    document.querySelector('.nav-item[data-section="chats"]').click(); 
};

// ======================= ربط زر الحذف الشامل =======================
document.getElementById('deleteAllBtn').addEventListener('click', deleteAllMessages);

// ======================= بدء التشغيل =======================
loadEmployees();
</script>
